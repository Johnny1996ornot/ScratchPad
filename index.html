<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeatBox - Demo Creator</title>
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --border: #30363d;
            --primary: #58a6ff;
            --accent: #2ea043;
            --danger: #f85149;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg); color: var(--text-main);
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            user-select: none; overflow-x: hidden;
        }

        .app-container { width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 20px; }

        /* HEADER */
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
        .logo h1 { margin: 0; font-size: 24px; font-weight: 900; letter-spacing: 2px; }
        .logo span { color: var(--primary); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .kofi-btn { background: #FFDD00; color: #000; text-decoration: none; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 13px; display: flex; align-items: center; gap: 8px;}
        .kofi-btn:hover { opacity: 0.9; }

        /* PANELS */
        .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
        .section-title { margin: 0 0 10px 0; font-size: 15px; color: #fff; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        
        /* TOP CONTROLS */
        .top-controls { display: flex; justify-content: space-between; align-items: center; background: var(--surface); padding: 15px; border-radius: 12px; border: 1px solid var(--border);}
        .play-btn { background: var(--primary); color: white; border: none; padding: 10px 20px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; }
        .play-btn.playing { background: var(--danger); }
        .bpm-control { display: flex; align-items: center; gap: 10px; font-weight: bold; }

        /* --- UI LAYOUT STRUCTURE --- */
        .track-row { display: flex; align-items: stretch; margin-bottom: 10px; border: 1px solid var(--border); border-radius: 6px; background: #090c10; }
        
        .track-header { 
            width: 180px; padding: 10px; background: var(--surface); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; justify-content: center; gap: 6px; flex-shrink: 0;
        }
        
        .track-content { flex: 1; position: relative; overflow: hidden; display: flex; align-items: center; padding: 4px; }
        
        /* Sliders */
        .controls-grid { display: grid; grid-template-columns: 35px 1fr; gap: 4px; align-items: center; }
        .controls-grid span { font-size: 10px; color: var(--text-muted); }
        .mini-slider { width: 100%; height: 4px; accent-color: var(--primary); }

        /* --- SECTION 1: THE BEAT --- */
        .drum-grid { 
            display: grid; grid-template-columns: repeat(16, 1fr); width: 100%; gap: 2px;
            min-width: 640px; /* Prevents disappearing boxes */
        }
        
        .step { 
            height: 40px; background: #21262d; border-radius: 4px; cursor: pointer; transition: 0.1s; 
            border: 1px solid #161b22;
        }
        .step:nth-child(4n + 1) { background: #2a313a; border-left: 2px solid rgba(88, 166, 255, 0.4); }
        
        .step.active[data-drum="kick"] { background: #ff7b72; box-shadow: 0 0 8px rgba(255,123,114,0.4); }
        .step.active[data-drum="snare"] { background: #d2a8ff; box-shadow: 0 0 8px rgba(210,168,255,0.4); }
        .step.active[data-drum="hihat"] { background: #7ee787; box-shadow: 0 0 8px rgba(126,231,135,0.4); }
        
        .playhead-beat { position: absolute; top: 0; bottom: 0; width: 2px; background: white; pointer-events: none; display: none; z-index: 10; box-shadow: 0 0 10px white; }

        /* --- SECTION 2: THE VOICE --- */
        .vocal-timeline { width: 100%; height: 80px; position: relative; background: #090c10; }

        .audio-clip { 
            position: absolute; height: 80%; top: 10%; background: #1f6feb; 
            border-radius: 4px; border: 1px solid #79c0ff; overflow: hidden;
            cursor: grab; /* Restored Drag functionality */
        }
        .audio-clip:active { cursor: grabbing; filter: brightness(1.2); }

        .recording-block { background: rgba(248,81,73,0.2); border: 1px dashed var(--danger); pointer-events: none; }
        .wave-canvas { width: 100%; height: 100%; display: block; pointer-events: none; }

        .btn-group { display: flex; gap: 4px; margin-top: 4px; }
        .btn-rec { flex: 1; background: transparent; border: 1px solid var(--danger); color: var(--danger); padding: 4px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 11px; }
        .btn-rec.is-recording { background: var(--danger); color: white; animation: blink 1s infinite; }
        .btn-solo { flex: 1; background: transparent; border: 1px solid var(--primary); color: var(--primary); padding: 4px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; }
        .btn-solo:hover { background: rgba(88, 166, 255, 0.2); }
        
        @keyframes blink { 50% { opacity: 0.6; } }
        
        .playhead-vocal { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--danger); pointer-events: none; display: none; z-index: 10; box-shadow: 0 0 10px var(--danger); }

    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="logo">
                <h1>BEATBOX</h1>
                <span>Demo Creator</span>
            </div>
            <a href="https://buymeacoffee.com/" target="_blank" class="kofi-btn">☕ Buy Me a Coffee</a>
        </header>

        <div class="top-controls">
            <button id="masterPlayBtn" class="play-btn">▶ Play Full Sequence</button>
            <div class="bpm-control">
                <label>BPM: <span id="bpmVal">120</span></label>
                <input type="range" id="bpmSlider" min="70" max="180" value="120">
            </div>
            <button id="downloadBtn" class="play-btn" style="background: var(--accent);">⬇ Download Mix (.WAV)</button>
        </div>

        <div class="panel">
            <h2 class="section-title">1. Guide Beat</h2>
            <div id="beat-container"></div>
        </div>

        <div class="panel">
            <h2 class="section-title">2. Free-Form Voice Recorder</h2>
            <div style="font-size: 12px; color: #8b949e; margin-bottom: 15px; border-left: 3px solid var(--primary); padding-left: 10px;">
                <strong>Recording:</strong> Put on headphones. Hit <b>🔴 Record</b> to start the beat and record freely. Your recording can be as long as you want.<br>
                <strong>Editing:</strong> <b>Drag</b> clips left/right to move them. <b>Double-click</b> a clip to split it into two.
            </div>
            <div id="vocal-container"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // --- AUDIO SYSTEM ---
            let audioCtx, masterGain, mixDest, noiseBuffer;
            const STEPS = 16;
            let tempo = 120;
            let isPlaying = false, isRecording = false;
            
            // Clocks
            let currentDrumStep = 0;
            let nextDrumTime = 0.0;
            let drumLoopStartOffset = 0.0; 
            let globalStartTime = 0.0;     
            let timerID;
            
            // Dynamic UI Scaling
            let projectDisplayDuration = 0; 
            
            // --- RESTORED DATA STRUCTURES ---
            const drumData = [
                { id: 'hihat', name: 'Hi-Hat', pitch: 1.0, pattern: [true, false, true, false, true, false, true, false, true, false, true, false, true, false, true, false] },
                { id: 'snare', name: 'Snare', pitch: 1.0, pattern: [false, false, false, false, true, false, false, false, false, false, false, false, true, false, false, false] },
                { id: 'kick', name: 'Kick', pitch: 1.0, pattern: [true, false, false, false, false, false, false, false, true, false, false, false, false, false, false, false] }
            ];

            let vocalTracks = [
                { id: 'vox-1', volume: 1.0, pitch: 1.0, echo: 0, gainNode: null, delayNode: null },
                { id: 'vox-2', volume: 1.0, pitch: 1.0, echo: 0, gainNode: null, delayNode: null }
            ];

            let vocalClips = [];
            let clipIdCounter = 0;
            let activeRecTrack = null, mediaRec, audioChunks = [];
            let liveAnalyser, liveDataArray, liveCanvasCtx;
            let recordingStartTime = 0, activeRecordingBlock = null;

            // --- UI BUILDER ---
            const beatContainer = document.getElementById('beat-container');
            const vocalContainer = document.getElementById('vocal-container');

            function buildInterface() {
                beatContainer.innerHTML = '';
                drumData.forEach((drum, index) => {
                    const row = document.createElement('div'); row.className = 'track-row';
                    
                    // Restored Drum Pitch Control
                    row.innerHTML = `
                        <div class="track-header">
                            <span style="font-weight:bold; font-size:13px;">${drum.name}</span>
                            <div class="controls-grid">
                                <span>Pitch</span>
                                <input type="range" class="mini-slider" min="0.5" max="2" step="0.1" value="${drum.pitch}" oninput="updateDrumPitch('${drum.id}', this.value)">
                            </div>
                        </div>
                    `;
                    
                    const content = document.createElement('div'); content.className = 'track-content';
                    if (index === 0) content.innerHTML = `<div id="playhead-beat" class="playhead-beat"></div>`;

                    const grid = document.createElement('div'); grid.className = 'drum-grid';
                    for (let i = 0; i < STEPS; i++) {
                        const step = document.createElement('div');
                        step.className = `step ${drum.pattern[i] ? 'active' : ''}`;
                        step.dataset.drum = drum.id;
                        step.onclick = () => { drum.pattern[i] = !drum.pattern[i]; step.classList.toggle('active'); };
                        grid.appendChild(step);
                    }
                    content.appendChild(grid);
                    row.appendChild(content); beatContainer.appendChild(row);
                });

                vocalContainer.innerHTML = '';
                vocalTracks.forEach((track, index) => {
                    const row = document.createElement('div'); row.className = 'track-row';
                    
                    // Restored Volume, Pitch, and Echo Controls for Vocals
                    row.innerHTML = `
                        <div class="track-header">
                            <span style="font-weight:bold; font-size:13px; color:white;">Track ${index + 1}</span>
                            <div class="btn-group">
                                <button class="btn-rec" onclick="toggleRecord('${track.id}')" id="rec-btn-${track.id}">🔴 Rec</button>
                                <button class="btn-solo" onclick="playSolo('${track.id}')">▶ Solo</button>
                            </div>
                            <div class="controls-grid" style="margin-top: 4px;">
                                <span>Vol</span><input type="range" class="mini-slider" min="0" max="2" step="0.1" value="${track.volume}" onchange="updateVoxFX('${track.id}', 'vol', this.value)">
                                <span>Pitch</span><input type="range" class="mini-slider" min="0.5" max="1.5" step="0.1" value="${track.pitch}" onchange="updateVoxFX('${track.id}', 'pitch', this.value)">
                                <span>Echo</span><input type="range" class="mini-slider" min="0" max="1" step="0.1" value="${track.echo}" onchange="updateVoxFX('${track.id}', 'echo', this.value)">
                            </div>
                        </div>
                        <div class="track-content">
                            <div class="vocal-timeline" id="timeline-${track.id}">
                                <div id="playhead-vox-${track.id}" class="playhead-vocal"></div>
                            </div>
                        </div>
                    `;
                    vocalContainer.appendChild(row);
                });
            }

            // --- SYNTHESIS & TIMING ---
            function getLoopDuration() { return (60.0 / tempo) * 0.25 * STEPS; }

            function initAudio() {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    masterGain = audioCtx.createGain(); masterGain.connect(audioCtx.destination);
                    mixDest = audioCtx.createMediaStreamDestination(); masterGain.connect(mixDest);
                    
                    noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
                    const output = noiseBuffer.getChannelData(0);
                    for (let i = 0; i < output.length; i++) output[i] = Math.random() * 2 - 1;
                    
                    initVocalRouting();
                    requestAnimationFrame(updateVisuals);
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();
            }

            function initVocalRouting() {
                vocalTracks.forEach(track => {
                    if(track.gainNode) return;
                    track.gainNode = audioCtx.createGain();
                    track.delayNode = audioCtx.createDelay(5.0); track.delayNode.delayTime.value = 0;
                    const feedback = audioCtx.createGain(); feedback.gain.value = 0.4;
                    track.delayNode.connect(feedback); feedback.connect(track.delayNode);
                    track.delayNode.connect(masterGain);
                    track.gainNode.connect(masterGain); track.gainNode.connect(track.delayNode); 
                    updateTrackFX(track);
                });
            }

            function updateTrackFX(track) {
                if(!track.gainNode) return;
                track.gainNode.gain.value = track.volume;
                track.delayNode.delayTime.value = track.echo > 0 ? (60 / tempo) * 0.75 : 0;
            }

            window.updateDrumPitch = (id, val) => { drumData.find(t => t.id === id).pitch = parseFloat(val); };
            window.updateVoxFX = (id, param, val) => {
                const track = vocalTracks.find(t => t.id === id);
                val = parseFloat(val);
                if (param === 'vol') track.volume = val; 
                if (param === 'pitch') track.pitch = val;
                if (param === 'echo') track.echo = val;
                updateTrackFX(track);
            };

            function playDrumSound(type, pitch, time, context = audioCtx, destination = masterGain) {
                if (type === 'kick') {
                    const osc = context.createOscillator(), gain = context.createGain();
                    osc.connect(gain).connect(destination);
                    osc.frequency.setValueAtTime(150 * pitch, time); osc.frequency.exponentialRampToValueAtTime(0.001, time + 0.5);
                    gain.gain.setValueAtTime(1, time); gain.gain.exponentialRampToValueAtTime(0.001, time + 0.5);
                    osc.start(time); osc.stop(time + 0.5);
                } else if (type === 'snare') {
                    const osc = context.createOscillator(), oGain = context.createGain();
                    osc.type = 'triangle'; osc.connect(oGain).connect(destination);
                    osc.frequency.setValueAtTime(250 * pitch, time); oGain.gain.setValueAtTime(0.7, time); oGain.gain.exponentialRampToValueAtTime(0.01, time + 0.1);
                    osc.start(time); osc.stop(time + 0.2);
                    
                    const noise = context.createBufferSource(), filter = context.createBiquadFilter(), gain2 = context.createGain();
                    noise.buffer = noiseBuffer; filter.type = 'highpass'; filter.frequency.value = 1000 * pitch;
                    gain2.gain.setValueAtTime(0.5, time); gain2.gain.exponentialRampToValueAtTime(0.01, time + 0.2);
                    noise.connect(filter).connect(gain2).connect(destination); noise.start(time); noise.stop(time + 0.2);
                } else if (type === 'hihat') {
                    const noise = context.createBufferSource(), filter = context.createBiquadFilter(), gain = context.createGain();
                    noise.buffer = noiseBuffer; filter.type = 'highpass'; filter.frequency.value = 7000 * pitch;
                    gain.gain.setValueAtTime(0.3, time); gain.gain.exponentialRampToValueAtTime(0.01, time + 0.05);
                    noise.connect(filter).connect(gain).connect(destination); noise.start(time); noise.stop(time + 0.05);
                }
            }

            function scheduler() {
                if (!isPlaying) return;
                
                while (nextDrumTime < audioCtx.currentTime + 0.1) {
                    drumData.forEach(d => { if (d.pattern[currentDrumStep]) playDrumSound(d.id, d.pitch, nextDrumTime); });
                    nextDrumTime += (60.0 / tempo) * 0.25;
                    currentDrumStep++;
                    
                    if (currentDrumStep >= STEPS) {
                        currentDrumStep = 0;
                        drumLoopStartOffset = nextDrumTime - getLoopDuration(); 
                    }
                }
                timerID = window.setTimeout(scheduler, 25.0);
            }

            // --- ISOLATED SOLO PLAYBACK ---
            window.playSolo = (trackId) => {
                initAudio();
                isPlaying = false;
                window.clearTimeout(timerID);
                document.getElementById('masterPlayBtn').innerText = "▶ Play Full Sequence"; 
                document.getElementById('masterPlayBtn').classList.remove('playing');
                document.getElementById('playhead-beat').style.display = 'none';
                
                vocalClips.forEach(c => { if(c.sourceNode) { try{c.sourceNode.stop();}catch(e){} } });

                const targetClips = vocalClips.filter(c => c.trackId === trackId);
                const trackSettings = vocalTracks.find(t => t.id === trackId);

                targetClips.forEach(c => {
                    const source = audioCtx.createBufferSource();
                    source.buffer = c.buffer;
                    source.playbackRate.value = trackSettings.pitch; // Apply Pitch FX
                    source.connect(trackSettings.gainNode);          // Apply Vol/Echo FX
                    source.start(0); 
                    c.sourceNode = source;
                });
            };

            // --- REAL-TIME VISUALS & SCALING ---
            function updateVisuals() {
                if (!audioCtx) return;
                
                let maxRequiredDuration = getLoopDuration() * 4; 
                vocalClips.forEach(c => { if (c.startTime + c.duration > maxRequiredDuration) maxRequiredDuration = c.startTime + c.duration; });
                
                if (isRecording) {
                    const currentRecLen = audioCtx.currentTime - recordingStartTime;
                    if (currentRecLen > maxRequiredDuration) maxRequiredDuration = currentRecLen;
                }
                projectDisplayDuration = maxRequiredDuration;

                if (isPlaying) {
                    const currentAbsTime = audioCtx.currentTime - globalStartTime;
                    const currentDrumOffset = audioCtx.currentTime - drumLoopStartOffset;
                    
                    const beatPct = (currentDrumOffset / getLoopDuration()) * 100;
                    const bPh = document.getElementById('playhead-beat');
                    if (bPh) { bPh.style.display = 'block'; bPh.style.left = `${beatPct}%`; }

                    const vocalPct = (currentAbsTime / projectDisplayDuration) * 100;
                    document.querySelectorAll('.playhead-vocal').forEach(ph => {
                        ph.style.display = 'block'; ph.style.left = `${vocalPct}%`;
                    });

                    if (isRecording && activeRecordingBlock) {
                        const recElapsed = audioCtx.currentTime - recordingStartTime;
                        const startPct = (recordingStartTime - globalStartTime) / projectDisplayDuration * 100;
                        const widthPct = (recElapsed / projectDisplayDuration) * 100;
                        
                        activeRecordingBlock.style.left = `${startPct}%`;
                        activeRecordingBlock.style.width = `${widthPct}%`;
                        drawOscilloscope();
                        renderStaticClips(); 
                    }
                }
                requestAnimationFrame(updateVisuals);
            }

            function drawOscilloscope() {
                if(!liveCanvasCtx || !liveAnalyser) return;
                liveAnalyser.getByteTimeDomainData(liveDataArray);
                liveCanvasCtx.clearRect(0,0,400,80);
                liveCanvasCtx.lineWidth = 2; liveCanvasCtx.strokeStyle = '#fff';
                liveCanvasCtx.beginPath();
                const sliceW = 400 / liveAnalyser.frequencyBinCount;
                let x = 0;
                for(let i=0; i<liveAnalyser.frequencyBinCount; i++) {
                    const y = (liveDataArray[i] / 128.0) * 40;
                    if(i===0) liveCanvasCtx.moveTo(x,y); else liveCanvasCtx.lineTo(x,y);
                    x += sliceW;
                }
                liveCanvasCtx.stroke();
            }

            // --- FREE-FORM RECORDING ---
            window.toggleRecord = async (trackId) => {
                const btn = document.getElementById(`rec-btn-${trackId}`);
                
                if (isRecording) {
                    if (activeRecTrack !== trackId) return;
                    mediaRec.stop(); isRecording = false; activeRecTrack = null;
                    if (activeRecordingBlock) activeRecordingBlock.remove();
                    btn.classList.remove('is-recording'); btn.innerText = '🔴 Rec';
                    return;
                }
                
                initAudio();
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const micSource = audioCtx.createMediaStreamSource(stream);
                    liveAnalyser = audioCtx.createAnalyser(); liveAnalyser.fftSize = 512;
                    micSource.connect(liveAnalyser); 
                    liveDataArray = new Uint8Array(liveAnalyser.frequencyBinCount);

                    mediaRec = new MediaRecorder(stream); audioChunks = [];
                    mediaRec.ondataavailable = e => audioChunks.push(e.data);
                    
                    mediaRec.onstop = async () => {
                        const arrayBuffer = await (new Blob(audioChunks)).arrayBuffer();
                        const audioBuf = await audioCtx.decodeAudioData(arrayBuffer);
                        
                        vocalClips.push({ 
                            id: `clip-${clipIdCounter++}`, buffer: audioBuf, trackId: trackId, 
                            startTime: recordingStartTime - globalStartTime, 
                            duration: audioBuf.duration, sourceNode: null
                        });
                        stream.getTracks().forEach(t => t.stop());
                        renderStaticClips();
                    };

                    if(!isPlaying) document.getElementById('masterPlayBtn').click();
                    
                    setTimeout(() => {
                        activeRecTrack = trackId; isRecording = true;
                        recordingStartTime = audioCtx.currentTime;
                        
                        activeRecordingBlock = document.createElement('div');
                        activeRecordingBlock.className = 'audio-clip recording-block';
                        activeRecordingBlock.innerHTML = `<canvas class="wave-canvas" width="400" height="80"></canvas>`;
                        
                        document.getElementById(`timeline-${trackId}`).appendChild(activeRecordingBlock);
                        liveCanvasCtx = activeRecordingBlock.querySelector('canvas').getContext('2d');
                        
                        mediaRec.start();
                        btn.classList.add('is-recording'); btn.innerText = '⏹ Stop';
                    }, 50);

                } catch (e) { alert("Microphone needed to record vocals."); }
            };

            function renderStaticClips() {
                document.querySelectorAll('.audio-clip:not(.recording-block)').forEach(el => el.remove());
                
                let maxDur = getLoopDuration() * 4;
                vocalClips.forEach(c => { if(c.startTime + c.duration > maxDur) maxDur = c.startTime + c.duration; });
                projectDisplayDuration = maxDur;

                vocalClips.forEach(clip => {
                    const trackEl = document.getElementById(`timeline-${clip.trackId}`);
                    if(!trackEl) return;
                    
                    const clipEl = document.createElement('div');
                    clipEl.className = 'audio-clip'; 
                    clipEl.id = clip.id;
                    clipEl.style.left = `${(clip.startTime / projectDisplayDuration) * 100}%`; 
                    clipEl.style.width = `${(clip.duration / projectDisplayDuration) * 100}%`;
                    clipEl.innerHTML = `<canvas class="wave-canvas" width="400" height="80"></canvas>`;
                    
                    // Add Drag and Split Listeners Restored Here
                    clipEl.addEventListener('mousedown', handleClipDrag);
                    clipEl.addEventListener('dblclick', (e) => handleClipSplit(e, clip));

                    const ctx = clipEl.querySelector('canvas').getContext('2d');
                    const data = clip.buffer.getChannelData(0);
                    ctx.fillStyle = 'rgba(255,255,255,0.8)';
                    const step = Math.ceil(data.length / 400);
                    for(let i=0; i<400; i++) {
                        let max=0; for(let j=0; j<step; j++) max = Math.max(max, Math.abs(data[i*step+j] || 0));
                        ctx.fillRect(i, 40 - (max*40), 1, max*80 || 1);
                    }
                    trackEl.appendChild(clipEl);
                });
            }

            // --- RESTORED DRAG & SPLIT FUNCTIONALITY ---
            function handleClipDrag(e) {
                e.preventDefault();
                let clip = vocalClips.find(c => c.id === e.target.closest('.audio-clip').id);
                const clipEl = document.getElementById(clip.id);
                const startMouseX = e.clientX;
                const startClipTime = clip.startTime;
                
                const onMouseMove = (moveEvent) => {
                    let foundTrackEl = null; let targetTrackId = clip.trackId;
                    document.querySelectorAll('.vocal-timeline').forEach(tEl => {
                        const r = tEl.getBoundingClientRect();
                        if (moveEvent.clientY >= r.top && moveEvent.clientY <= r.bottom) { 
                            targetTrackId = tEl.id.replace('timeline-', ''); foundTrackEl = tEl; 
                        }
                    });
                    
                    if (foundTrackEl) {
                        const trackRect = foundTrackEl.getBoundingClientRect();
                        const pixelMove = moveEvent.clientX - startMouseX;
                        const timeMove = (pixelMove / trackRect.width) * projectDisplayDuration;
                        
                        let newTime = startClipTime + timeMove;
                        newTime = Math.max(0, newTime); // Prevent dragging before 0
                        
                        clip.trackId = targetTrackId;
                        clip.startTime = newTime;
                        
                        clipEl.style.left = `${(newTime / projectDisplayDuration) * 100}%`;
                        if(clipEl.parentElement !== foundTrackEl) foundTrackEl.appendChild(clipEl);
                    }
                };
                
                const onMouseUp = (upEvent) => {
                    window.removeEventListener('mousemove', onMouseMove); window.removeEventListener('mouseup', onMouseUp);
                    const r = vocalContainer.getBoundingClientRect();
                    if (upEvent.clientY < r.top - 50 || upEvent.clientY > r.bottom + 50) vocalClips = vocalClips.filter(c => c.id !== clip.id);
                    renderStaticClips();
                };
                window.addEventListener('mousemove', onMouseMove); window.addEventListener('mouseup', onMouseUp);
            }

            async function handleClipSplit(e, clip) {
                e.preventDefault();
                const r = e.target.closest('.audio-clip').getBoundingClientRect();
                const clickRatio = (e.clientX - r.left) / r.width;
                if(clickRatio <= 0.1 || clickRatio >= 0.9) return;
                
                const splitSamples = Math.floor(clip.buffer.length * clickRatio);
                const buf1 = audioCtx.createBuffer(1, splitSamples, audioCtx.sampleRate);
                const buf2 = audioCtx.createBuffer(1, clip.buffer.length - splitSamples, audioCtx.sampleRate);
                
                buf1.copyToChannel(clip.buffer.getChannelData(0).slice(0, splitSamples), 0); 
                buf2.copyToChannel(clip.buffer.getChannelData(0).slice(splitSamples), 0);
                
                clip.buffer = buf1;
                const origDuration = clip.duration;
                clip.duration = origDuration * clickRatio;
                
                vocalClips.push({ 
                    id: `clip-${clipIdCounter++}`, buffer: buf2, trackId: clip.trackId, 
                    startTime: clip.startTime + clip.duration, duration: origDuration * (1 - clickRatio), sourceNode: null 
                });
                renderStaticClips();
            }

            // --- PLAYBACK CONTROLS ---
            document.getElementById('masterPlayBtn').addEventListener('click', (e) => {
                initAudio(); isPlaying = !isPlaying;
                if(isPlaying) {
                    currentDrumStep = 0;
                    globalStartTime = audioCtx.currentTime + 0.05;
                    drumLoopStartOffset = globalStartTime;
                    nextDrumTime = globalStartTime;
                    
                    vocalClips.forEach(c => {
                        const trackSettings = vocalTracks.find(t => t.id === c.trackId);
                        const source = audioCtx.createBufferSource();
                        source.buffer = c.buffer;
                        source.playbackRate.value = trackSettings.pitch;
                        source.connect(trackSettings.gainNode);
                        source.start(globalStartTime + c.startTime);
                        c.sourceNode = source;
                    });
                    
                    scheduler();
                    e.target.innerText = "⏸ Stop Sequence"; e.target.classList.add('playing');
                } else {
                    window.clearTimeout(timerID); 
                    vocalClips.forEach(c => { if(c.sourceNode) { try{c.sourceNode.stop();}catch(e){} } });
                    e.target.innerText = "▶ Play Full Sequence"; e.target.classList.remove('playing');
                    document.getElementById('playhead-beat').style.display = 'none';
                    document.querySelectorAll('.playhead-vocal').forEach(ph => ph.style.display = 'none');
                    if (isRecording && activeRecTrack) window.toggleRecord(activeRecTrack);
                }
            });

            document.getElementById('bpmSlider').addEventListener('input', (e) => {
                tempo = e.target.value; document.getElementById('bpmVal').innerText = tempo;
                if(!isPlaying) renderStaticClips(); 
            });

            // --- PRO STUDIO EXPORT ---
            document.getElementById('downloadBtn').addEventListener('click', async (e) => {
                initAudio();
                const btn = e.target;
                const originalText = btn.innerText;
                btn.innerText = "⏳ Bouncing Mix..."; btn.disabled = true;

                let maxDuration = getLoopDuration(); 
                vocalClips.forEach(c => { if (c.startTime + c.duration > maxDuration) maxDuration = c.startTime + c.duration; });
                maxDuration += 0.5; 

                const offlineCtx = new OfflineAudioContext(1, audioCtx.sampleRate * maxDuration, audioCtx.sampleRate);
                
                // Reconstruct Routing for Offline Mix
                const offlineMaster = offlineCtx.createGain(); offlineMaster.connect(offlineCtx.destination);
                const offlineVocalTracks = vocalTracks.map(t => {
                    const g = offlineCtx.createGain(); const d = offlineCtx.createDelay(5.0); const fb = offlineCtx.createGain();
                    d.delayTime.value = t.echo > 0 ? (60 / tempo) * 0.75 : 0; fb.gain.value = 0.4;
                    d.connect(fb); fb.connect(d); d.connect(offlineMaster); g.connect(offlineMaster); g.connect(d);
                    g.gain.value = t.volume;
                    return { id: t.id, gainNode: g, pitch: t.pitch };
                });

                let renderTime = 0.0;
                let step = 0;
                while (renderTime < maxDuration) {
                    drumData.forEach(d => {
                        if (d.pattern[step % STEPS]) playDrumSound(d.id, d.pitch, renderTime, offlineCtx, offlineMaster);
                    });
                    renderTime += (60.0 / tempo) * 0.25;
                    step++;
                }

                vocalClips.forEach(c => {
                    const trackSettings = offlineVocalTracks.find(t => t.id === c.trackId);
                    const source = offlineCtx.createBufferSource();
                    source.buffer = c.buffer;
                    source.playbackRate.value = trackSettings.pitch;
                    source.connect(trackSettings.gainNode);
                    source.start(c.startTime);
                });

                const renderedBuffer = await offlineCtx.startRendering();
                const wavBlob = audioBufferToWav(renderedBuffer);
                
                const url = URL.createObjectURL(wavBlob);
                const a = document.createElement('a'); a.style.display = 'none'; a.href = url;
                a.download = 'BeatBox_Studio_Mix.wav'; document.body.appendChild(a); a.click();
                
                btn.innerText = originalText; btn.disabled = false;
            });

            function audioBufferToWav(buffer) {
                const numOfChan = buffer.numberOfChannels, length = buffer.length * numOfChan * 2 + 44;
                const out = new ArrayBuffer(length), view = new DataView(out);
                const channels = [], sampleRate = buffer.sampleRate;
                let offset = 0, pos = 0;
                
                function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
                function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }
                
                setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157);
                setUint32(0x20746d66); setUint32(16); setUint16(1); setUint16(numOfChan);
                setUint32(sampleRate); setUint32(sampleRate * 2 * numOfChan); setUint16(numOfChan * 2); setUint16(16);
                setUint32(0x61746164); setUint32(length - pos - 4);
                
                for(let i=0; i<buffer.numberOfChannels; i++) channels.push(buffer.getChannelData(i));
                while(offset < buffer.length) {
                    for(let i=0; i<numOfChan; i++) {
                        let sample = Math.max(-1, Math.min(1, channels[i][offset]));
                        sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
                        view.setInt16(pos, sample, true); pos += 2;
                    }
                    offset++;
                }
                return new Blob([out], { type: "audio/wav" });
            }

            // Init
            buildInterface();
        });
    </script>
