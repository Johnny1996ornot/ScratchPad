<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeatBox - Pro Demo Creator V7</title>
    <style>
        /* --- CORE STYLING & DAW THEME --- */
        :root {
            --bg: #0d1117; --surface: #161b22; --border: #30363d;
            --primary: #58a6ff; --accent: #2ea043; --danger: #f85149;
            --warning: #d29922; --text-main: #c9d1d9; --text-muted: #8b949e;
            --drum-kick: #ff7b72; --drum-snare: #d2a8ff; --drum-hihat: #7ee787;
            --drum-tom: #f0883e; --drum-clap: #79c0ff;
            --selected: #e3b341;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg); color: var(--text-main);
            margin: 0; padding: 10px 20px; display: flex; flex-direction: column; align-items: center;
            user-select: none; overflow-x: hidden;
        }

        .app-container { width: 100%; max-width: 1300px; display: flex; flex-direction: column; gap: 15px; }

        /* --- HEADER & MASTER CONTROLS --- */
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
        .logo h1 { margin: 0; font-size: 22px; font-weight: 900; letter-spacing: 2px; }
        .logo span { color: var(--primary); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
        
        .kofi-btn { background: #FFDD00; color: #000; text-decoration: none; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 12px; display: flex; align-items: center; gap: 8px; }
        .kofi-btn:hover { opacity: 0.9; }
        
        .top-controls { display: flex; justify-content: space-between; align-items: center; background: var(--surface); padding: 10px 15px; border-radius: 8px; border: 1px solid var(--border); }
        .btn-master { color: white; border: none; padding: 10px 15px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.1s; }
        .btn-master:active { transform: scale(0.97); }
        .btn-master-full { background: var(--primary); }
        .btn-master.playing { background: var(--danger); }
        .btn-download { background: var(--accent); }

        .toolbar-group { display: flex; align-items: center; gap: 15px; font-weight: bold; font-size: 12px; }
        .slider-control { display: flex; align-items: center; gap: 8px; }
        .slider-control input { width: 100px; accent-color: var(--primary); }

        /* --- PANELS & SECTION HEADERS --- */
        .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        
        .section-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 10px; }
        .section-title { margin: 0; font-size: 14px; color: #fff; text-transform: uppercase; letter-spacing: 1px; }
        
        .header-tools { display: flex; gap: 10px; align-items: center;}
        .step-select { background: #090c10; color: white; border: 1px solid var(--border); padding: 5px 10px; border-radius: 4px; outline: none; font-weight: bold;}
        .btn-beat { background: #8957e5; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 12px;}
        .btn-beat.playing { background: var(--danger); }
        .btn-add-track { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; margin-top: 10px; width: 100%;}
        .btn-add-drum { background: #238636; color: white; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; margin-top: 10px; width: 100%;}

        .instructions { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; line-height: 1.4; background: #090c10; padding: 8px; border-radius: 6px; border: 1px solid var(--border); }

        /* --- TRACK LAYOUTS --- */
        .track-row { display: flex; align-items: stretch; margin-bottom: 8px; border: 1px solid var(--border); border-radius: 6px; background: #090c10; }
        .track-header { width: 280px; padding: 10px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; justify-content: center; gap: 8px; flex-shrink: 0; border-radius: 6px 0 0 6px; position: relative;}
        
        .track-viewport { flex: 1; overflow-x: auto; overflow-y: hidden; position: relative; display: flex; align-items: center; padding: 5px 0; background: #0d1117;}
        .track-inner { position: relative; height: 100%; min-width: 100%; }

        /* --- TRACK CONTROLS --- */
        .controls-grid { display: grid; grid-template-columns: 45px 1fr 20px; gap: 6px; align-items: center; }
        .controls-grid span { font-size: 10px; color: var(--text-muted); font-weight: 600; text-transform: uppercase;}
        .mini-slider { width: 100%; height: 3px; accent-color: var(--primary); cursor: pointer; }
        .btn-reset { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 12px; padding: 0; }
        .btn-reset:hover { color: white; }

        .btn-group { display: flex; gap: 4px; }
        .btn-action { flex: 1; background: transparent; border: 1px solid var(--border); color: var(--text-main); padding: 5px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 10px; text-align: center; }
        .btn-action:hover { background: rgba(255,255,255,0.05); }
        .btn-action.del { border-color: var(--text-muted); color: var(--text-muted); }
        .btn-action.del:hover { background: var(--danger); color: white; border-color: var(--danger); }
        
        .btn-rec-overwrite { border-color: var(--danger); color: var(--danger); }
        .btn-rec-append { border-color: var(--warning); color: var(--warning); }
        .btn-solo { border-color: var(--primary); color: var(--primary); }
        
        .btn-rec-overwrite.is-recording, .btn-rec-append.is-recording { background: var(--danger); color: white; border-color: var(--danger); animation: pulse 1s infinite; }
        .btn-rec-append.is-waiting { background: var(--warning); color: #000; animation: pulse 1s infinite; }

        .instrument-select { width: 100%; background: #0d1117; color: var(--primary); border: 1px solid var(--border); border-radius: 4px; padding: 4px; font-weight: bold; font-size: 12px; margin-bottom: 4px; outline: none; cursor: pointer;}

        @keyframes pulse { 50% { opacity: 0.6; } }

        /* --- DRUM SEQUENCER --- */
        .drum-inner { min-width: 100%; }
        .drum-grid { display: grid; gap: 2px; height: 30px; width: 100%; }
        .step { background: #21262d; border-radius: 3px; cursor: pointer; transition: 0.1s; border: 1px solid #161b22; }
        
        .step:nth-child(4n + 1) { background: #2a313a; border-left: 2px solid rgba(88, 166, 255, 0.3); }
        .step:nth-child(16n + 1) { border-left: 2px solid rgba(255, 255, 255, 0.5); }
        
        .step.active[data-type="kick"] { background: var(--drum-kick); box-shadow: 0 0 8px rgba(255,123,114,0.3); }
        .step.active[data-type="snare"] { background: var(--drum-snare); box-shadow: 0 0 8px rgba(210,168,255,0.3); }
        .step.active[data-type="hihat"] { background: var(--drum-hihat); box-shadow: 0 0 8px rgba(126,231,135,0.3); }
        .step.active[data-type="tom"] { background: var(--drum-tom); box-shadow: 0 0 8px rgba(240,136,62,0.3); }
        .step.active[data-type="clap"] { background: var(--drum-clap); box-shadow: 0 0 8px rgba(121,192,255,0.3); }

        /* --- VOCAL TIMELINE --- */
        .vocal-timeline-inner { height: 75px; position: relative; background: #090c10; }
        .grid-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 15; opacity: 1.0; }

        .audio-clip {
            position: absolute; height: 80%; top: 10%; background: #1f6feb; border-radius: 4px;
            border: 1px solid #79c0ff; overflow: hidden; cursor: grab; box-shadow: 0 2px 8px rgba(0,0,0,0.4); z-index: 5;
        }
        .audio-clip.selected { border-color: var(--selected); background: #3b74c4; box-shadow: 0 0 12px rgba(227, 179, 65, 0.6); z-index: 6;}
        .audio-clip:active { cursor: grabbing; }

        .recording-block { background: rgba(248,81,73,0.25); border: 2px dashed var(--danger); pointer-events: none; z-index: 4; }
        .wave-canvas { width: 100%; height: 100%; display: block; pointer-events: none; }

        /* --- PLAYHEADS --- */
        .playhead-beat { position: absolute; top: -2px; bottom: -2px; width: 2px; background: #ffffff; pointer-events: none; display: none; z-index: 20; box-shadow: 0 0 8px rgba(255,255,255,0.8); }
        .playhead-vocal { position: absolute; top: 0; height: 100%; width: 2px; background: var(--danger); pointer-events: none; display: none; z-index: 20; box-shadow: 0 0 8px var(--danger); }

    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="logo">
                <h1>BEATBOX</h1>
                <span>Pro Studio V7</span>
            </div>
            <a href="https://buymeacoffee.com/" target="_blank" class="kofi-btn">☕ Buy Me a Coffee</a>
        </header>

        <div class="top-controls">
            <button id="btnPlayFull" class="btn-master btn-master-full">▶ Play Full Track</button>
            <div class="toolbar-group">
                <div class="slider-control">
                    <span>🥁 Master Vol</span>
                    <input type="range" id="masterDrumVol" min="0" max="2" step="0.05" value="1">
                </div>
                <div class="slider-control" style="margin-left: 20px;">
                    <span>Tempo (BPM): <span id="bpmVal">120</span></span>
                    <input type="range" id="bpmSlider" min="70" max="180" value="120">
                </div>
            </div>
            <button id="btnDownload" class="btn-master btn-download">⬇ Export .WAV</button>
        </div>

        <div class="panel">
            <div class="section-header">
                <h2 class="section-title">1. Dynamic Drum Rack</h2>
                <div class="header-tools">
                    <select id="stepSelector" class="step-select">
                        <option value="8">8 Steps</option>
                        <option value="16" selected>16 Steps (1 Bar)</option>
                        <option value="32">32 Steps (2 Bars)</option>
                    </select>
                    <button id="btnPlayBeat" class="btn-beat">🥁 Play Beat Only</button>
                </div>
            </div>
            <div class="instructions">
                <strong>Customize:</strong> Use the dropdown menu on any drum track to change the instrument. Add as many tracks as you want to layer sounds or create complex rhythms.
            </div>
            <div id="beat-container"></div>
            <button class="btn-add-drum" onclick="addDrumTrack()">➕ Add Drum Track</button>
        </div>

        <div class="panel">
            <h2 class="section-title">2. Vocal Studio</h2>
            <div id="vocal-container"></div>
            <button class="btn-add-track" onclick="addVocalTrack()">➕ Add Vocal Track</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // ==========================================
            // 1. CORE SYSTEM & DAW STATE
            // ==========================================
            let audioCtx, masterGain, drumMasterGain, mixDest;
            let sharedReverbBuffer = null; 
            
            let STEPS = 16;
            let tempo = 120;
            let PPS = 80; 
            
            let playState = 'STOPPED'; 
            let isRecording = false;
            let isWaitingToPunchIn = false;
            
            let currentDrumStep = 0;
            let nextDrumTime = 0.0;
            let drumLoopStartOffset = 0.0; 
            let globalStartTime = 0.0;     
            let timerID;
            
            let selectedClipId = null;
            let clipboardData = null;
            
            // Counters for IDs
            let drumIdCounter = 4;
            let voxIdCounter = 3;
            
            // ==========================================
            // 2. DATA STRUCTURES (Now Dynamic Drums)
            // ==========================================
            let drumTracks = [
                { id: 'drum-1', type: 'hihat', pitch: 1.0, volume: 1.0, reverb: 0.0, inputGain: null, reverbMix: null, convolver: null, 
                  pattern: [true, false, true, false, true, false, true, false, true, false, true, false, true, false, true, false, true, false, true, false, true, false, true, false, true, false, true, false, true, false, true, false] },
                { id: 'drum-2', type: 'snare', pitch: 1.0, volume: 1.0, reverb: 0.2, inputGain: null, reverbMix: null, convolver: null, 
                  pattern: [false, false, false, false, true, false, false, false, false, false, false, false, true, false, false, false, false, false, false, false, true, false, false, false, false, false, false, false, true, false, false, false] },
                { id: 'drum-3', type: 'kick', pitch: 1.0, volume: 1.0, reverb: 0.0, inputGain: null, reverbMix: null, convolver: null, 
                  pattern: [true, false, false, false, false, false, false, false, true, false, false, false, false, false, false, false, true, false, false, false, false, false, false, false, true, false, false, false, false, false, false, false] }
            ];

            let vocalTracks = [
                { id: 'vox-1', volume: 1.0, pitch: 1.0, reverb: 0.0, echo: 0.0, inputGain: null, reverbMix: null, convolver: null, delayNode: null, delayMix: null, delayFeedback: null },
                { id: 'vox-2', volume: 1.0, pitch: 1.0, reverb: 0.0, echo: 0.0, inputGain: null, reverbMix: null, convolver: null, delayNode: null, delayMix: null, delayFeedback: null }
            ];

            let vocalClips = [];
            let clipIdCounter = 0;
            
            let activeRecTrack = null, mediaRec, audioChunks = [];
            let punchInTargetTime = 0, recordingStartTime = 0, activeRecordingBlock = null;
            let liveAnalyser, liveDataArray, liveCanvasCtx;

            // ==========================================
            // 3. UI GENERATION
            // ==========================================
            const beatContainer = document.getElementById('beat-container');
            const vocalContainer = document.getElementById('vocal-container');

            function buildInterface() {
                beatContainer.innerHTML = '';
                drumTracks.forEach((drum) => {
                    const row = document.createElement('div'); row.className = 'track-row';
                    
                    const instOptions = ['kick', 'snare', 'hihat', 'tom', 'clap'].map(type => 
                        `<option value="${type}" ${drum.type === type ? 'selected' : ''}>${type.toUpperCase()}</option>`
                    ).join('');

                    row.innerHTML = `
                        <div class="track-header">
                            <select class="instrument-select" onchange="changeDrumType('${drum.id}', this.value)">
                                ${instOptions}
                            </select>
                            <div class="controls-grid" style="margin-top: 4px;">
                                <span>Vol</span><input type="range" class="mini-slider" min="0" max="2" step="0.1" value="${drum.volume}" oninput="updateDrumFX('${drum.id}', 'vol', this.value)"><button class="btn-action del" style="grid-row: span 3; height:100%; padding: 0;" onclick="deleteDrumTrack('${drum.id}')">🗑️</button>
                                <span>Pitch</span><input type="range" id="pitch-${drum.id}" class="mini-slider" min="0.5" max="2" step="0.1" value="${drum.pitch}" oninput="updateDrumFX('${drum.id}', 'pitch', this.value)">
                                <span>Reverb</span><input type="range" class="mini-slider" min="0" max="1" step="0.1" value="${drum.reverb}" oninput="updateDrumFX('${drum.id}', 'reverb', this.value)">
                            </div>
                        </div>
                        <div class="track-viewport" style="overflow-x: auto;">
                            <div class="track-inner drum-inner" style="display: flex; align-items: center; position: relative;">
                                <div id="playhead-beat-${drum.id}" class="playhead-beat"></div>
                                <div class="drum-grid" style="grid-template-columns: repeat(${STEPS}, 1fr);"></div>
                            </div>
                        </div>
                    `;
                    
                    const grid = row.querySelector('.drum-grid');
                    for (let i = 0; i < STEPS; i++) {
                        const step = document.createElement('div');
                        step.className = `step ${drum.pattern[i] ? 'active' : ''}`;
                        step.dataset.type = drum.type; // Color depends on type
                        step.onclick = () => { 
                            drum.pattern[i] = !drum.pattern[i]; 
                            step.classList.toggle('active'); 
                            if(audioCtx && drum.pattern[i]) playDrumSound(drum, audioCtx.currentTime); // Preview sound
                            drawSyncGrids(); 
                        };
                        grid.appendChild(step);
                    }
                    beatContainer.appendChild(row);
                });

                vocalContainer.innerHTML = '';
                vocalTracks.forEach((track, index) => {
                    const row = document.createElement('div'); row.className = 'track-row';
                    row.innerHTML = `
                        <div class="track-header">
                            <span style="font-weight:bold; font-size:13px; color:white;">Vocal Track ${index + 1}</span>
                            <div class="btn-group">
                                <button class="btn-action btn-rec-overwrite" onclick="startRecording('${track.id}', false)" id="rec-btn-new-${track.id}">🔴 Record</button>
                                <button class="btn-action btn-rec-append" onclick="startRecording('${track.id}', true)" id="rec-btn-append-${track.id}">➕ Append</button>
                            </div>
                            <div class="btn-group">
                                <button class="btn-action btn-solo" onclick="playSolo('${track.id}')">▶ Solo</button>
                                <button class="btn-action del" onclick="deleteVocalTrack('${track.id}')">🗑️ Del Track</button>
                            </div>
                            <div class="controls-grid" style="margin-top: 2px;">
                                <span>Vol</span><input type="range" class="mini-slider" min="0" max="2" step="0.1" value="${track.volume}" onchange="updateVoxFX('${track.id}', 'vol', this.value)"><div></div>
                                <span>Pitch</span><input type="range" id="pitch-${track.id}" class="mini-slider" min="0.5" max="1.5" step="0.1" value="${track.pitch}" onchange="updateVoxFX('${track.id}', 'pitch', this.value)"><button class="btn-reset" onclick="resetPitch('${track.id}', 'vox')">↺</button>
                                <span>Reverb</span><input type="range" class="mini-slider" min="0" max="1" step="0.1" value="${track.reverb}" onchange="updateVoxFX('${track.id}', 'reverb', this.value)"><div></div>
                                <span>Echo</span><input type="range" class="mini-slider" min="0" max="1" step="0.1" value="${track.echo}" onchange="updateVoxFX('${track.id}', 'echo', this.value)"><div></div>
                            </div>
                        </div>
                        <div class="track-viewport" id="viewport-${track.id}">
                            <div class="track-inner vocal-timeline-inner" id="timeline-${track.id}">
                                <canvas class="grid-canvas"></canvas>
                                <div id="playhead-vox-${track.id}" class="playhead-vocal"></div>
                            </div>
                        </div>
                    `;
                    vocalContainer.appendChild(row);

                    const viewport = row.querySelector('.track-viewport');
                    viewport.addEventListener('wheel', (e) => {
                        if (e.ctrlKey) {
                            e.preventDefault();
                            let delta = e.deltaY > 0 ? -10 : 10;
                            updateZoom(PPS + delta);
                        }
                    }, {passive: false});
                });
                
                renderStaticClips(); 
            }

            // UI Actions
            window.addDrumTrack = () => {
                const newId = `drum-${drumIdCounter++}`;
                const emptyPattern = new Array(32).fill(false);
                drumTracks.push({ id: newId, type: 'kick', pitch: 1.0, volume: 1.0, reverb: 0.0, inputGain: null, reverbMix: null, convolver: null, pattern: emptyPattern });
                buildInterface();
                if(audioCtx) initDrumRouting();
            };

            window.deleteDrumTrack = (id) => {
                drumTracks = drumTracks.filter(t => t.id !== id);
                buildInterface();
                drawSyncGrids();
            };

            window.changeDrumType = (id, newType) => {
                const drum = drumTracks.find(d => d.id === id);
                if (drum) {
                    drum.type = newType;
                    buildInterface();
                    if(audioCtx) playDrumSound(drum, audioCtx.currentTime); // Preview
                }
            };

            window.addVocalTrack = () => {
                const newId = `vox-${voxIdCounter++}`;
                vocalTracks.push({ id: newId, volume: 1.0, pitch: 1.0, reverb: 0.0, echo: 0.0, inputGain: null, reverbMix: null, convolver: null, delayNode: null, delayMix: null, delayFeedback: null });
                buildInterface();
                if(audioCtx) initVocalRouting(); 
            };

            window.deleteVocalTrack = (id) => {
                vocalTracks = vocalTracks.filter(t => t.id !== id);
                vocalClips = vocalClips.filter(c => c.trackId !== id);
                buildInterface();
            };

            document.getElementById('stepSelector').addEventListener('change', (e) => {
                STEPS = parseInt(e.target.value);
                buildInterface();
            });

            // ==========================================
            // 4. AUDIO ROUTING
            // ==========================================
            function getLoopDuration() { return (60.0 / tempo) * 0.25 * STEPS; }

            function createReverbIR(audioCtx) {
                let length = audioCtx.sampleRate * 2.5; 
                let impulse = audioCtx.createBuffer(2, length, audioCtx.sampleRate);
                let left = impulse.getChannelData(0); let right = impulse.getChannelData(1);
                for (let i = 0; i < length; i++) {
                    let n = 1 - (i / length);
                    left[i] = (Math.random() * 2 - 1) * Math.pow(n, 3);
                    right[i] = (Math.random() * 2 - 1) * Math.pow(n, 3);
                }
                return impulse;
            }

            function initAudio() {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    masterGain = audioCtx.createGain(); 
                    masterGain.gain.value = 0.9; 
                    masterGain.connect(audioCtx.destination);
                    mixDest = audioCtx.createMediaStreamDestination(); masterGain.connect(mixDest);
                    
                    drumMasterGain = audioCtx.createGain();
                    drumMasterGain.gain.value = document.getElementById('masterDrumVol').value;
                    drumMasterGain.connect(masterGain);
                    
                    sharedReverbBuffer = createReverbIR(audioCtx);
                    
                    initDrumRouting();
                    initVocalRouting();
                    requestAnimationFrame(updateVisuals);
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();
            }

            function initDrumRouting() {
                drumTracks.forEach(track => {
                    if (track.inputGain) return;
                    track.inputGain = audioCtx.createGain();
                    track.reverbMix = audioCtx.createGain();
                    track.convolver = audioCtx.createConvolver();
                    track.convolver.buffer = sharedReverbBuffer;

                    track.inputGain.connect(drumMasterGain); 
                    track.inputGain.connect(track.convolver);
                    track.convolver.connect(track.reverbMix);
                    track.reverbMix.connect(drumMasterGain); 

                    applyDrumFX(track);
                });
            }

            function initVocalRouting() {
                vocalTracks.forEach(track => {
                    if(track.inputGain) return;
                    track.inputGain = audioCtx.createGain();
                    
                    track.reverbMix = audioCtx.createGain();
                    track.convolver = audioCtx.createConvolver();
                    track.convolver.buffer = sharedReverbBuffer;
                    
                    track.delayNode = audioCtx.createDelay(5.0); track.delayNode.delayTime.value = 0;
                    track.delayFeedback = audioCtx.createGain(); track.delayFeedback.gain.value = 0.4;
                    track.delayMix = audioCtx.createGain();

                    track.delayNode.connect(track.delayFeedback); track.delayFeedback.connect(track.delayNode);

                    track.inputGain.connect(masterGain); 
                    track.inputGain.connect(track.convolver);
                    track.convolver.connect(track.reverbMix);
                    track.reverbMix.connect(masterGain);
                    
                    track.inputGain.connect(track.delayNode);
                    track.delayNode.connect(track.delayMix);
                    track.delayMix.connect(masterGain);
                    
                    applyVoxFX(track);
                });
            }

            function applyDrumFX(track) {
                if(!track.inputGain) return;
                track.inputGain.gain.value = track.volume;
                track.reverbMix.gain.value = track.reverb;
            }

            function applyVoxFX(track) {
                if(!track.inputGain) return;
                track.inputGain.gain.value = track.volume;
                track.reverbMix.gain.value = track.reverb;
                track.delayNode.delayTime.value = track.echo > 0 ? (60 / tempo) * 0.75 : 0;
                track.delayMix.gain.value = track.echo;
            }

            window.updateDrumFX = (id, param, val) => {
                const t = drumTracks.find(d => d.id === id); val = parseFloat(val);
                if (param === 'vol') t.volume = val; if (param === 'pitch') t.pitch = val; if (param === 'reverb') t.reverb = val;
                applyDrumFX(t);
            };

            window.updateVoxFX = (id, param, val) => {
                const t = vocalTracks.find(v => v.id === id); val = parseFloat(val);
                if (param === 'vol') t.volume = val; if (param === 'pitch') t.pitch = val; 
                if (param === 'reverb') t.reverb = val; if (param === 'echo') t.echo = val;
                applyVoxFX(t);
                
                if (playState !== 'STOPPED' && audioCtx) {
                    vocalClips.forEach(c => {
                        if (c.trackId === id && c.sourceNode) c.sourceNode.playbackRate.value = t.pitch;
                    });
                }
            };

            window.resetPitch = (id, type) => {
                document.getElementById(`pitch-${id}`).value = 1.0;
                if(type === 'drum') updateDrumFX(id, 'pitch', 1.0);
                if(type === 'vox') updateVoxFX(id, 'pitch', 1.0);
            };

            document.getElementById('masterDrumVol').addEventListener('input', (e) => {
                if(drumMasterGain) drumMasterGain.gain.value = parseFloat(e.target.value);
            });

            // ==========================================
            // 5. SYNTHESIS (NEW TYPES ADDED)
            // ==========================================
            function playDrumSound(track, time, context = audioCtx, destination = drumMasterGain) {
                let targetDest = (context === audioCtx && track.inputGain) ? track.inputGain : destination;

                if (track.type === 'kick') {
                    const osc = context.createOscillator(), gain = context.createGain();
                    osc.connect(gain).connect(targetDest);
                    osc.frequency.setValueAtTime(150 * track.pitch, time); 
                    osc.frequency.exponentialRampToValueAtTime(45 * track.pitch, time + 0.1);
                    osc.frequency.exponentialRampToValueAtTime(0.001, time + 0.6);
                    gain.gain.setValueAtTime(1.2, time); 
                    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.6);
                    osc.start(time); osc.stop(time + 0.6);

                } else if (track.type === 'snare') {
                    const osc = context.createOscillator(), oGain = context.createGain();
                    osc.type = 'sine'; osc.connect(oGain).connect(targetDest);
                    osc.frequency.setValueAtTime(220 * track.pitch, time); 
                    osc.frequency.exponentialRampToValueAtTime(120 * track.pitch, time + 0.1); 
                    oGain.gain.setValueAtTime(1.0, time); oGain.gain.exponentialRampToValueAtTime(0.01, time + 0.2);
                    osc.start(time); osc.stop(time + 0.2);

                    const noise = context.createBufferSource(), filter = context.createBiquadFilter(), gain = context.createGain();
                    let nBuffer = context.createBuffer(1, context.sampleRate * 0.5, context.sampleRate);
                    let nData = nBuffer.getChannelData(0);
                    for (let i = 0; i < nData.length; i++) nData[i] = Math.random() * 2 - 1;
                    noise.buffer = nBuffer; filter.type = 'bandpass'; filter.frequency.value = 2500 * track.pitch; filter.Q.value = 0.8;
                    gain.gain.setValueAtTime(0.5, time); gain.gain.exponentialRampToValueAtTime(0.01, time + 0.2);
                    noise.connect(filter).connect(gain).connect(targetDest); noise.start(time); noise.stop(time + 0.2);

                } else if (track.type === 'hihat') {
                    const noise = context.createBufferSource(), filter = context.createBiquadFilter(), gain = context.createGain();
                    let nBuffer = context.createBuffer(1, context.sampleRate * 0.1, context.sampleRate);
                    let nData = nBuffer.getChannelData(0);
                    for (let i = 0; i < nData.length; i++) nData[i] = Math.random() * 2 - 1;
                    noise.buffer = nBuffer; filter.type = 'highpass'; filter.frequency.value = 7000 * track.pitch;
                    gain.gain.setValueAtTime(0.6, time); gain.gain.exponentialRampToValueAtTime(0.01, time + 0.05);
                    noise.connect(filter).connect(gain).connect(targetDest); noise.start(time); noise.stop(time + 0.05);
                
                } else if (track.type === 'tom') {
                    const osc = context.createOscillator(), gain = context.createGain();
                    osc.type = 'sine'; osc.connect(gain).connect(targetDest);
                    osc.frequency.setValueAtTime(250 * track.pitch, time); 
                    osc.frequency.exponentialRampToValueAtTime(80 * track.pitch, time + 0.3);
                    gain.gain.setValueAtTime(1.0, time); gain.gain.exponentialRampToValueAtTime(0.01, time + 0.4);
                    osc.start(time); osc.stop(time + 0.4);
                    
                } else if (track.type === 'clap') {
                    const filter = context.createBiquadFilter(), gain = context.createGain();
                    filter.type = 'bandpass'; filter.frequency.value = 1500 * track.pitch; filter.Q.value = 1.5;
                    gain.connect(targetDest);
                    
                    // Create three rapid noise bursts for a realistic clap
                    [0, 0.015, 0.03].forEach(delay => {
                        const noise = context.createBufferSource();
                        let nBuffer = context.createBuffer(1, context.sampleRate * 0.1, context.sampleRate);
                        let nData = nBuffer.getChannelData(0);
                        for (let i = 0; i < nData.length; i++) nData[i] = Math.random() * 2 - 1;
                        noise.buffer = nBuffer;
                        
                        const bGain = context.createGain();
                        bGain.gain.setValueAtTime(0.8, time + delay);
                        bGain.gain.exponentialRampToValueAtTime(0.01, time + delay + 0.1);
                        
                        noise.connect(filter).connect(bGain).connect(gain);
                        noise.start(time + delay); noise.stop(time + delay + 0.1);
                    });
                }
            }

            function scheduler() {
                if (playState === 'STOPPED') return;
                
                while (nextDrumTime < audioCtx.currentTime + 0.1) {
                    if (playState !== 'SOLO') {
                        drumTracks.forEach(d => { if (d.pattern[currentDrumStep]) playDrumSound(d, nextDrumTime); });
                    }
                    nextDrumTime += (60.0 / tempo) * 0.25;
                    currentDrumStep++;
                    if (currentDrumStep >= STEPS) currentDrumStep = 0;
                }
                timerID = window.setTimeout(scheduler, 25.0);
            }

            // ==========================================
            // 6. RECORDING SYSTEM
            // ==========================================
            window.startRecording = async (trackId, isAppend) => {
                const btnNew = document.getElementById(`rec-btn-new-${trackId}`);
                const btnAppend = document.getElementById(`rec-btn-append-${trackId}`);
                
                if (isRecording || isWaitingToPunchIn) { stopPlayback(); return; }
                initAudio();

                if (!isAppend) {
                    clearTrack(trackId);
                    punchInTargetTime = 0;
                } else {
                    punchInTargetTime = 0;
                    const trackClips = vocalClips.filter(c => c.trackId === trackId);
                    trackClips.forEach(c => {
                        if (c.startTime + c.duration > punchInTargetTime) punchInTargetTime = c.startTime + c.duration;
                    });
                }

                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const micSource = audioCtx.createMediaStreamSource(stream);
                    
                    liveAnalyser = audioCtx.createAnalyser(); liveAnalyser.fftSize = 512;
                    micSource.connect(liveAnalyser); 
                    liveDataArray = new Uint8Array(liveAnalyser.frequencyBinCount);

                    mediaRec = new MediaRecorder(stream); 
                    audioChunks = [];
                    mediaRec.ondataavailable = e => { if(e.data.size > 0) audioChunks.push(e.data); };
                    
                    mediaRec.onstop = async () => {
                        try {
                            const blob = new Blob(audioChunks, { type: mediaRec.mimeType || 'audio/webm' });
                            const arrayBuffer = await blob.arrayBuffer();
                            const audioBuf = await audioCtx.decodeAudioData(arrayBuffer);
                            
                            vocalClips.push({ 
                                id: `clip-${clipIdCounter++}`, buffer: audioBuf, trackId: trackId, 
                                startTime: punchInTargetTime, duration: audioBuf.duration, sourceNode: null
                            });
                            stream.getTracks().forEach(t => t.stop());
                            renderStaticClips(); 
                        } catch (error) {}
                    };

                    activeRecTrack = trackId;
                    startPlayback('FULL');

                    if (punchInTargetTime === 0) {
                        mediaRec.start(); isRecording = true; recordingStartTime = audioCtx.currentTime;
                        createLiveBlock(trackId, 0);
                        btnNew.classList.add('is-recording'); btnNew.innerText = '⏹ Stop';
                    } else {
                        isWaitingToPunchIn = true;
                        btnAppend.classList.add('is-waiting'); btnAppend.innerText = '⏳ Wait...';
                    }

                } catch (e) { alert("Microphone access is required."); }
            };

            function createLiveBlock(trackId, startOffsetTime) {
                const trackEl = document.getElementById(`timeline-${trackId}`);
                activeRecordingBlock = document.createElement('div');
                activeRecordingBlock.className = 'audio-clip recording-block';
                activeRecordingBlock.innerHTML = `<canvas class="wave-canvas" width="400" height="80"></canvas>`;
                trackEl.appendChild(activeRecordingBlock);
                liveCanvasCtx = activeRecordingBlock.querySelector('canvas').getContext('2d');
            }

            // ==========================================
            // 7. PIXELS-PER-SECOND SCALING & VISUALS
            // ==========================================
            function updateZoom(newPPS) {
                PPS = Math.max(30, Math.min(newPPS, 500)); 
                renderStaticClips(); 
            }

            function drawSyncGrids() {
                const beatSecs = (60 / tempo) * 0.25; 
                
                document.querySelectorAll('.grid-canvas').forEach(canvas => {
                    const p = canvas.parentElement;
                    canvas.width = p.clientWidth; canvas.height = p.clientHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0,0, canvas.width, canvas.height);
                    
                    for (let i = 0; i < STEPS; i++) {
                        const x = i * beatSecs * PPS;
                        if (x > canvas.width) break;

                        // Check ALL drum tracks dynamically for visual overlays
                        drumTracks.forEach(drum => {
                            if (drum.pattern[i]) {
                                if (drum.type === 'kick') { ctx.fillStyle = 'rgba(255, 123, 114, 0.7)'; ctx.fillRect(x, 0, 4, canvas.height); }
                                else if (drum.type === 'snare') { ctx.fillStyle = 'rgba(210, 168, 255, 0.7)'; ctx.fillRect(x, 0, 4, canvas.height); }
                                else if (drum.type === 'clap') { ctx.fillStyle = 'rgba(121, 192, 255, 0.6)'; ctx.fillRect(x, 0, 4, canvas.height); }
                            }
                        });
                        
                        ctx.beginPath();
                        if (i % 4 === 0) {
                            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
                            ctx.fillRect(x, 0, 2, canvas.height);
                        } else {
                            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                            ctx.lineWidth = 1;
                            ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
                        }
                    }
                });
            }

            function updateVisuals() {
                if (!audioCtx) return;
                
                let maxAudioSecs = 30; 
                vocalClips.forEach(c => { if (c.startTime + c.duration > maxAudioSecs) maxAudioSecs = c.startTime + c.duration; });
                if (isRecording) {
                    const currentRecLen = punchInTargetTime + (audioCtx.currentTime - recordingStartTime);
                    if (currentRecLen > maxAudioSecs) maxAudioSecs = currentRecLen;
                }
                
                const reqPx = maxAudioSecs * PPS;
                document.querySelectorAll('.vocal-timeline-inner').forEach(inner => {
                    if (inner.clientWidth < reqPx) {
                        inner.style.width = `${reqPx + 500}px`; 
                        drawSyncGrids();
                    }
                });

                if (playState !== 'STOPPED') {
                    const currentAbsTime = audioCtx.currentTime - globalStartTime;
                    
                    if (!isRecording && !isWaitingToPunchIn && playState !== 'BEAT_ONLY' && currentAbsTime > maxAudioSecs + 0.5) {
                        stopPlayback(); return;
                    }

                    const loopDur = getLoopDuration();
                    const currentDrumOffset = audioCtx.currentTime - drumLoopStartOffset;
                    const beatCycleTime = currentDrumOffset % loopDur;
                    const beatPct = (beatCycleTime / loopDur) * 100;
                    
                    drumTracks.forEach(drum => {
                        const bPh = document.getElementById(`playhead-beat-${drum.id}`);
                        if (bPh) { 
                            bPh.style.display = playState === 'SOLO' ? 'none' : 'block'; 
                            bPh.style.left = `${beatPct}%`; 
                        }
                    });

                    const vocalPx = currentAbsTime * PPS;
                    document.querySelectorAll('.playhead-vocal').forEach(ph => {
                        ph.style.display = playState === 'BEAT_ONLY' ? 'none' : 'block';
                        ph.style.left = `${vocalPx}px`;
                        
                        const vp = ph.closest('.track-viewport');
                        if (vp && (vocalPx > vp.scrollLeft + vp.clientWidth * 0.9)) {
                            vp.scrollLeft = vocalPx - vp.clientWidth * 0.5;
                        }
                    });

                    if (isWaitingToPunchIn && currentAbsTime >= punchInTargetTime) {
                        isWaitingToPunchIn = false;
                        mediaRec.start(); isRecording = true; recordingStartTime = audioCtx.currentTime;
                        createLiveBlock(activeRecTrack, currentAbsTime);
                        const btnAppend = document.getElementById(`rec-btn-append-${activeRecTrack}`);
                        if(btnAppend) { btnAppend.classList.remove('is-waiting'); btnAppend.classList.add('is-recording'); btnAppend.innerText = '⏹ Stop'; }
                    }

                    if (isRecording && activeRecordingBlock) {
                        const recElapsed = audioCtx.currentTime - recordingStartTime;
                        activeRecordingBlock.style.left = `${punchInTargetTime * PPS}px`;
                        activeRecordingBlock.style.width = `${recElapsed * PPS}px`;
                        drawOscilloscope();
                    }
                }
                requestAnimationFrame(updateVisuals);
            }

            function drawOscilloscope() {
                if(!liveCanvasCtx || !liveAnalyser) return;
                liveAnalyser.getByteTimeDomainData(liveDataArray);
                const w = activeRecordingBlock.clientWidth; const h = 80;
                liveCanvasCtx.canvas.width = w; liveCanvasCtx.canvas.height = h;
                liveCanvasCtx.clearRect(0,0,w,h);
                liveCanvasCtx.lineWidth = 2; liveCanvasCtx.strokeStyle = '#fff';
                liveCanvasCtx.beginPath();
                const sliceW = w / liveAnalyser.frequencyBinCount; let x = 0;
                for(let i=0; i<liveAnalyser.frequencyBinCount; i++) {
                    const y = (liveDataArray[i] / 128.0) * (h/2);
                    if(i===0) liveCanvasCtx.moveTo(x,y); else liveCanvasCtx.lineTo(x,y);
                    x += sliceW;
                }
                liveCanvasCtx.stroke();
            }

            // ==========================================
            // 8. CLIP RENDERING & UI DYNAMICS
            // ==========================================
            function renderStaticClips() {
                document.querySelectorAll('.audio-clip:not(.recording-block)').forEach(el => el.remove());
                
                vocalClips.forEach(clip => {
                    const trackEl = document.getElementById(`timeline-${clip.trackId}`);
                    if(!trackEl) return;
                    
                    const clipEl = document.createElement('div');
                    clipEl.className = 'audio-clip'; 
                    if (clip.id === selectedClipId) clipEl.classList.add('selected');
                    clipEl.id = clip.id;
                    
                    clipEl.style.left = `${clip.startTime * PPS}px`; 
                    clipEl.style.width = `${clip.duration * PPS}px`;
                    clipEl.innerHTML = `<canvas class="wave-canvas"></canvas>`;
                    
                    clipEl.addEventListener('mousedown', handleClipDrag);
                    clipEl.addEventListener('dblclick', (e) => handleClipSplit(e, clip));

                    const ctx = clipEl.querySelector('canvas').getContext('2d');
                    const w = Math.max(1, clip.duration * PPS);
                    ctx.canvas.width = w; ctx.canvas.height = 80;
                    const data = clip.buffer.getChannelData(0);
                    ctx.fillStyle = 'rgba(255,255,255,0.8)';
                    const step = Math.ceil(data.length / w);
                    for(let i=0; i<w; i++) {
                        let max=0; for(let j=0; j<step; j++) max = Math.max(max, Math.abs(data[i*step+j] || 0));
                        ctx.fillRect(i, 40 - (max*40), 1, max*80 || 1);
                    }
                    trackEl.appendChild(clipEl);
                });
                drawSyncGrids();
                updateRecordButtons();
            }

            function updateRecordButtons() {
                vocalTracks.forEach(track => {
                    const btnNew = document.getElementById(`rec-btn-new-${track.id}`);
                    if (btnNew && !btnNew.classList.contains('is-recording')) {
                        const hasClips = vocalClips.some(c => c.trackId === track.id);
                        btnNew.innerText = hasClips ? '🔴 Overwrite' : '🔴 Record';
                    }
                });
            }

            function handleClipDrag(e) {
                e.preventDefault();
                selectedClipId = e.target.closest('.audio-clip').id;
                renderStaticClips(); 

                let clip = vocalClips.find(c => c.id === selectedClipId);
                const clipEl = document.getElementById(clip.id);
                const startMouseX = e.clientX;
                const startClipTime = clip.startTime;
                
                const onMouseMove = (moveEvent) => {
                    let foundTrackEl = null; let targetTrackId = clip.trackId;
                    document.querySelectorAll('.vocal-timeline-inner').forEach(tEl => {
                        const r = tEl.getBoundingClientRect();
                        if (moveEvent.clientY >= r.top && moveEvent.clientY <= r.bottom) { 
                            targetTrackId = tEl.id.replace('timeline-', ''); foundTrackEl = tEl; 
                        }
                    });
                    
                    if (foundTrackEl) {
                        const pixelMove = moveEvent.clientX - startMouseX;
                        const timeMove = pixelMove / PPS; 
                        
                        let newTime = startClipTime + timeMove;
                        newTime = Math.max(0, newTime); 
                        
                        clip.trackId = targetTrackId;
                        clip.startTime = newTime;
                        clipEl.style.left = `${newTime * PPS}px`;
                        if(clipEl.parentElement !== foundTrackEl) foundTrackEl.appendChild(clipEl);
                    }
                };
                
                const onMouseUp = (upEvent) => {
                    window.removeEventListener('mousemove', onMouseMove); window.removeEventListener('mouseup', onMouseUp);
                    renderStaticClips();
                };
                window.addEventListener('mousemove', onMouseMove); window.addEventListener('mouseup', onMouseUp);
            }

            async function handleClipSplit(e, clip) {
                e.preventDefault();
                const r = e.target.closest('.audio-clip').getBoundingClientRect();
                const clickRatio = (e.clientX - r.left) / r.width;
                if(clickRatio <= 0.1 || clickRatio >= 0.9) return;
                
                const splitSamples = Math.floor(clip.buffer.length * clickRatio);
                const buf1 = audioCtx.createBuffer(1, splitSamples, audioCtx.sampleRate);
                const buf2 = audioCtx.createBuffer(1, clip.buffer.length - splitSamples, audioCtx.sampleRate);
                
                buf1.copyToChannel(clip.buffer.getChannelData(0).slice(0, splitSamples), 0); 
                buf2.copyToChannel(clip.buffer.getChannelData(0).slice(splitSamples), 0);
                
                clip.buffer = buf1;
                const origDuration = clip.duration;
                clip.duration = origDuration * clickRatio;
                
                vocalClips.push({ 
                    id: `clip-${clipIdCounter++}`, buffer: buf2, trackId: clip.trackId, 
                    startTime: clip.startTime + clip.duration, duration: origDuration * (1 - clickRatio), sourceNode: null 
                });
                renderStaticClips();
            }

            window.addEventListener('keydown', (e) => {
                if (isRecording || isWaitingToPunchIn || e.target.tagName === 'INPUT') return;
                
                if (selectedClipId) {
                    if (e.key === 'Delete' || e.key === 'Backspace') {
                        vocalClips = vocalClips.filter(c => c.id !== selectedClipId);
                        selectedClipId = null;
                        renderStaticClips();
                    }
                    if (e.ctrlKey && e.key === 'c') {
                        clipboardData = vocalClips.find(c => c.id === selectedClipId);
                    }
                }
                
                if (e.ctrlKey && e.key === 'v' && clipboardData) {
                    const currentAbsTime = (playState !== 'STOPPED' && audioCtx) ? audioCtx.currentTime - globalStartTime : 0;
                    vocalClips.push({
                        id: `clip-${clipIdCounter++}`,
                        buffer: clipboardData.buffer, trackId: clipboardData.trackId,
                        startTime: currentAbsTime, duration: clipboardData.duration, sourceNode: null
                    });
                    renderStaticClips();
                }
            });

            // ==========================================
            // 9. PLAYBACK CONTROLS
            // ==========================================
            function startPlayback(mode, targetTrackId = null) {
                initAudio();
                window.clearTimeout(timerID); 
                vocalClips.forEach(c => { if(c.sourceNode) { try{c.sourceNode.stop();}catch(e){} } });
                
                playState = mode;
                currentDrumStep = 0;
                globalStartTime = audioCtx.currentTime + 0.05;
                drumLoopStartOffset = globalStartTime;
                nextDrumTime = globalStartTime;
                
                vocalClips.forEach(c => {
                    if (playState === 'FULL' || (playState === 'SOLO' && c.trackId === targetTrackId)) {
                        const trackSettings = vocalTracks.find(t => t.id === c.trackId);
                        const source = audioCtx.createBufferSource();
                        source.buffer = c.buffer;
                        source.playbackRate.value = trackSettings.pitch;
                        source.connect(trackSettings.inputGain);
                        source.start(globalStartTime + c.startTime);
                        c.sourceNode = source;
                    }
                });
                scheduler();
            }

            function stopPlayback() {
                window.clearTimeout(timerID); 
                vocalClips.forEach(c => { if(c.sourceNode) { try{c.sourceNode.stop();}catch(e){} } });
                
                if (isRecording || isWaitingToPunchIn) {
                    if (mediaRec && mediaRec.state !== 'inactive') mediaRec.stop();
                    isRecording = false; isWaitingToPunchIn = false;
                    if (activeRecordingBlock) activeRecordingBlock.remove();
                    activeRecTrack = null;
                }

                playState = 'STOPPED';
                document.getElementById('btnPlayFull').innerText = "▶ Play Full Track"; document.getElementById('btnPlayFull').classList.remove('playing');
                document.getElementById('btnPlayBeat').innerText = "🥁 Play Beat Only"; document.getElementById('btnPlayBeat').classList.remove('playing');
                
                document.querySelectorAll('.btn-rec-append').forEach(btn => { btn.classList.remove('is-recording', 'is-waiting'); btn.innerText = '➕ Append'; });
                document.querySelectorAll('.btn-rec-overwrite').forEach(btn => { btn.classList.remove('is-recording'); });
                updateRecordButtons(); 
                
                document.querySelectorAll('.playhead-beat').forEach(ph => ph.style.display = 'none');
                document.querySelectorAll('.playhead-vocal').forEach(ph => ph.style.display = 'none');
            }

            document.getElementById('btnPlayFull').addEventListener('click', () => {
                if(playState !== 'STOPPED') stopPlayback(); else { startPlayback('FULL'); document.getElementById('btnPlayFull').innerText = "⏸ Stop Full"; document.getElementById('btnPlayFull').classList.add('playing'); }
            });

            document.getElementById('btnPlayBeat').addEventListener('click', () => {
                if(playState !== 'STOPPED') stopPlayback(); else { startPlayback('BEAT_ONLY'); document.getElementById('btnPlayBeat').innerText = "⏸ Stop Beat"; document.getElementById('btnPlayBeat').classList.add('playing'); }
            });

            window.playSolo = (trackId) => {
                if(playState === 'SOLO') stopPlayback(); else { startPlayback('SOLO', trackId); document.getElementById('btnPlayFull').innerText = "⏸ Stop Solo"; document.getElementById('btnPlayFull').classList.add('playing'); }
            };

            document.getElementById('bpmSlider').addEventListener('input', (e) => {
                tempo = e.target.value; document.getElementById('bpmVal').innerText = tempo;
                drawSyncGrids();
            });

            document.body.addEventListener('mousedown', (e) => {
                if (!e.target.closest('.audio-clip')) {
                    selectedClipId = null;
                    document.querySelectorAll('.audio-clip').forEach(el => el.classList.remove('selected'));
                }
            });

            // ==========================================
            // 10. STUDIO EXPORT (.WAV)
            // ==========================================
            document.getElementById('btnDownload').addEventListener('click', async (e) => {
                initAudio(); const btn = e.target; const originalText = btn.innerText; btn.innerText = "⏳ Bouncing Mix..."; btn.disabled = true;

                let maxDuration = getLoopDuration(); 
                vocalClips.forEach(c => { if (c.startTime + c.duration > maxDuration) maxDuration = c.startTime + c.duration; });
                maxDuration += 0.5; 

                const offlineCtx = new OfflineAudioContext(2, audioCtx.sampleRate * maxDuration, audioCtx.sampleRate);
                const offlineMaster = offlineCtx.createGain(); offlineMaster.connect(offlineCtx.destination);
                
                const offlineDrumMaster = offlineCtx.createGain();
                offlineDrumMaster.gain.value = document.getElementById('masterDrumVol').value;
                offlineDrumMaster.connect(offlineMaster);
                
                const offlineReverbBuffer = createReverbIR(offlineCtx);

                const offlineDrumTracks = drumTracks.map(t => {
                    const g = offlineCtx.createGain(); const rMix = offlineCtx.createGain(); const conv = offlineCtx.createConvolver();
                    conv.buffer = offlineReverbBuffer;
                    g.connect(offlineDrumMaster); g.connect(conv); conv.connect(rMix); rMix.connect(offlineDrumMaster);
                    g.gain.value = t.volume; rMix.gain.value = t.reverb;
                    return { id: t.id, type: t.type, inputGain: g, pitch: t.pitch }; // Added type here
                });

                const offlineVocalTracks = vocalTracks.map(t => {
                    const g = offlineCtx.createGain(); 
                    const rMix = offlineCtx.createGain(); const conv = offlineCtx.createConvolver(); conv.buffer = offlineReverbBuffer;
                    const d = offlineCtx.createDelay(5.0); const fb = offlineCtx.createGain(); const dMix = offlineCtx.createGain();
                    
                    d.delayTime.value = t.echo > 0 ? (60 / tempo) * 0.75 : 0; fb.gain.value = 0.4;
                    d.connect(fb); fb.connect(d); d.connect(dMix); dMix.connect(offlineMaster);
                    g.connect(offlineMaster); g.connect(conv); conv.connect(rMix); rMix.connect(offlineMaster); g.connect(d);
                    
                    g.gain.value = t.volume; rMix.gain.value = t.reverb; dMix.gain.value = t.echo;
                    return { id: t.id, inputGain: g, pitch: t.pitch };
                });

                let renderTime = 0.0; let step = 0;
                while (renderTime < maxDuration) {
                    drumTracks.forEach(d => { 
                        if (d.pattern[step % STEPS]) {
                            const trackSettings = offlineDrumTracks.find(t => t.id === d.id);
                            playDrumSound(trackSettings, renderTime, offlineCtx, offlineDrumMaster); 
                        }
                    });
                    renderTime += (60.0 / tempo) * 0.25; step++;
                }

                vocalClips.forEach(c => {
                    const trackSettings = offlineVocalTracks.find(t => t.id === c.trackId);
                    const source = offlineCtx.createBufferSource(); source.buffer = c.buffer;
                    source.playbackRate.value = trackSettings.pitch; source.connect(trackSettings.inputGain);
                    source.start(c.startTime);
                });

                const renderedBuffer = await offlineCtx.startRendering();
                const wavBlob = audioBufferToWav(renderedBuffer);
                const url = URL.createObjectURL(wavBlob);
                const a = document.createElement('a'); a.style.display = 'none'; a.href = url;
                a.download = 'BeatBox_Pro_Mix.wav'; document.body.appendChild(a); a.click();
                
                btn.innerText = originalText; btn.disabled = false;
            });

            function audioBufferToWav(buffer) {
                const numOfChan = buffer.numberOfChannels, length = buffer.length * numOfChan * 2 + 44;
                const out = new ArrayBuffer(length), view = new DataView(out);
                const channels = [], sampleRate = buffer.sampleRate; let offset = 0, pos = 0;
                
                function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
                function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }
                
                setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157);
                setUint32(0x20746d66); setUint32(16); setUint16(1); setUint16(numOfChan);
                setUint32(sampleRate); setUint32(sampleRate * 2 * numOfChan); setUint16(numOfChan * 2); setUint16(16);
                setUint32(0x61746164); setUint32(length - pos - 4);
                
                for(let i=0; i<buffer.numberOfChannels; i++) channels.push(buffer.getChannelData(i));
                while(offset < buffer.length) {
                    for(let i=0; i<numOfChan; i++) {
                        let sample = Math.max(-1, Math.min(1, channels[i][offset]));
                        sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
                        view.setInt16(pos, sample, true); pos += 2;
                    }
                    offset++;
                }
                return new Blob([out], { type: "audio/wav" });
            }

            buildInterface();
        });
    </script>
