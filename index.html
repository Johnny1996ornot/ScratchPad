<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeatBox - Pro Studio V8 (Complete)</title>
    <style>
        /* --- CORE STYLING & DAW THEME --- */
        :root {
            --bg: #0d1117; --surface: #161b22; --border: #30363d;
            --primary: #58a6ff; --accent: #2ea043; --danger: #f85149;
            --warning: #d29922; --text-main: #c9d1d9; --text-muted: #8b949e;
            --drum-kick: #ff7b72; --drum-snare: #d2a8ff; --drum-hihat: #7ee787;
            --chord-active: #e3b341; --selected: #e3b341;
        }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text-main); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; user-select: none; overflow-x: hidden; }
        .app-container { width: 100%; max-width: 1400px; display: flex; flex-direction: column; gap: 20px; }

        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
        .logo h1 { margin: 0; font-size: 26px; font-weight: 900; letter-spacing: 2px; }
        .logo span { color: var(--primary); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
        
        .kofi-btn { background: #FFDD00; color: #000; text-decoration: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .kofi-btn:hover { opacity: 0.9; }

        .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .section-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 15px; }
        .section-title { margin: 0; font-size: 16px; color: #fff; text-transform: uppercase; letter-spacing: 1px; }

        /* --- TABS SYSTEM --- */
        .tabs-container { display: flex; gap: 5px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; border-bottom: 1px solid var(--border); }
        .tab { padding: 8px 16px; background: #21262d; border: 1px solid var(--border); border-radius: 6px 6px 0 0; cursor: pointer; font-weight: bold; font-size: 13px; color: var(--text-muted); transition: 0.2s; display: flex; align-items: center; gap: 8px;}
        .tab.active { background: var(--surface); color: white; border-bottom-color: var(--surface); }
        .tab-color-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
        .btn-add-tab { background: transparent; color: var(--primary); border: 1px dashed var(--primary); border-radius: 6px; cursor: pointer; padding: 0 15px; font-weight: bold; }

        /* --- BANK CONTROLS --- */
        .bank-controls { display: flex; gap: 20px; align-items: center; margin-bottom: 15px; background: #090c10; padding: 10px; border-radius: 8px; border: 1px solid var(--border); }
        .slider-control { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: bold; }
        .slider-control input { width: 100px; accent-color: var(--primary); }
        .btn { padding: 8px 16px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 13px; transition: 0.1s; color: white;}
        .btn:active { transform: scale(0.97); }
        .btn-play-loop { background: #8957e5; }
        .btn-play-loop.playing { background: var(--danger); }
        .btn-drag-source { background: transparent; border: 1px dashed white; cursor: grab; padding: 6px 12px; border-radius: 6px; }
        .btn-drag-source:active { cursor: grabbing; }

        /* --- TRACK LAYOUTS --- */
        .track-row { display: flex; align-items: stretch; margin-bottom: 8px; border: 1px solid var(--border); border-radius: 8px; background: #090c10; }
        .track-header { width: 260px; padding: 10px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; justify-content: center; gap: 8px; flex-shrink: 0; border-radius: 8px 0 0 8px; }
        .track-name-dropdown { background: transparent; color: var(--primary); font-weight: bold; font-size: 14px; border: none; outline: none; cursor: pointer; }
        .track-name-dropdown option { background: var(--surface); color: white; }
        
        .track-viewport { flex: 1; overflow-x: auto; overflow-y: hidden; position: relative; display: flex; align-items: center; padding: 5px 0; background: #0d1117;}
        .track-inner { position: relative; height: 100%; min-width: 100%; }

        /* --- CONTROLS & FX --- */
        .controls-grid { display: grid; grid-template-columns: 40px 1fr; gap: 5px; align-items: center; font-size: 10px; color: var(--text-muted); font-weight: bold; }
        .mini-slider { width: 100%; height: 3px; accent-color: var(--primary); cursor: pointer; }

        .btn-group { display: flex; gap: 6px; }
        .btn-action { flex: 1; background: transparent; border: 1px solid var(--border); color: var(--text-main); padding: 4px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 10px; text-align: center; }
        .btn-action:hover { background: rgba(255,255,255,0.05); }
        .btn-rec-overwrite { border-color: var(--danger); color: var(--danger); }
        .btn-rec-append { border-color: var(--warning); color: var(--warning); }
        .btn-solo { border-color: var(--primary); color: var(--primary); }
        .btn-rec-overwrite.is-recording, .btn-rec-append.is-recording { background: var(--danger); color: white; border-color: var(--danger); animation: pulse 1s infinite; }
        .btn-rec-append.is-waiting { background: var(--warning); color: #000; animation: pulse 1s infinite; }
        @keyframes pulse { 50% { opacity: 0.6; } }

        /* --- SEQUENCER GRID --- */
        .drum-grid { display: grid; gap: 2px; height: 36px; width: 100%; }
        .step { background: #21262d; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: black; border: 1px solid #161b22; }
        .step.start-beat { border-left: 2px solid rgba(88, 166, 255, 0.4); }
        .step.start-bar { border-left: 3px solid rgba(255, 255, 255, 0.6); }
        .step.active.type-kick { background: var(--drum-kick); box-shadow: 0 0 10px rgba(255,123,114,0.3); }
        .step.active.type-snare { background: var(--drum-snare); box-shadow: 0 0 10px rgba(210,168,255,0.3); }
        .step.active.type-hihat { background: var(--drum-hihat); box-shadow: 0 0 10px rgba(126,231,135,0.3); }
        .step.active.type-piano { background: var(--chord-active); box-shadow: 0 0 10px rgba(227, 179, 65, 0.4); }
        .step.active.type-synth { background: #bf398e; color: white; box-shadow: 0 0 10px rgba(191, 57, 142, 0.4);}

        /* CHORD MENU */
        .chord-menu { position: fixed; background: var(--surface); border: 1px solid var(--border); padding: 5px; border-radius: 6px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; z-index: 1000; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .chord-btn { background: #21262d; border: none; color: white; padding: 8px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .chord-btn:hover { background: var(--primary); color: black; }
        .chord-btn.off { background: var(--danger); grid-column: span 3; }

        /* --- STUDIO ARRANGER --- */
        .studio-controls { display: flex; justify-content: space-between; align-items: center; background: #090c10; padding: 15px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 15px; flex-wrap: wrap; gap: 10px;}
        .btn-master-full { background: var(--primary); font-size: 16px; padding: 12px 24px;}
        .btn-download { background: var(--accent); font-size: 16px; padding: 12px 24px;}
        
        .timeline-inner { height: 90px; position: relative; background: #090c10; }
        .grid-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 15; opacity: 0.3; }

        /* Arranger Clips */
        .clip { position: absolute; height: 75%; top: 12.5%; border-radius: 6px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.4); z-index: 5; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; text-shadow: 0 1px 2px rgba(0,0,0,0.8); cursor: grab;}
        .clip:active { cursor: grabbing; }
        .clip.selected { box-shadow: 0 0 0 2px yellow; z-index: 10; border-color: yellow; }
        
        .clip-beat { color: white; border: 1px solid rgba(255,255,255,0.3); }
        .clip-vocal { background: #1f6feb; border: 2px solid #79c0ff; }
        .wave-canvas { width: 100%; height: 100%; display: block; pointer-events: none; position: absolute; top:0; left:0; z-index: -1;}
        .recording-block { background: rgba(248,81,73,0.25); border: 2px dashed var(--danger); pointer-events: none; z-index: 4; }

        .resize-handle { position: absolute; right: 0; top: 0; width: 10px; height: 100%; background: rgba(255,255,255,0.2); cursor: ew-resize; z-index: 20; border-left: 1px solid rgba(255,255,255,0.5);}
        .resize-handle:hover { background: rgba(255,255,255,0.6); }

        .playhead-absolute { position: absolute; top: 0; height: 100%; width: 2px; background: var(--danger); pointer-events: none; display: none; z-index: 30; box-shadow: 0 0 10px var(--danger); }
        .playhead-beat { position: absolute; top: -2px; bottom: -2px; width: 3px; background: #ffffff; pointer-events: none; display: none; z-index: 20; border-radius: 2px; box-shadow: 0 0 10px rgba(255,255,255,0.8);}

        /* Vocal Tools */
        .btn-tool { background: var(--surface); border: 1px solid var(--border); color: white; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer;}
        .btn-tool.active { background: var(--warning); color: black; border-color: var(--warning); }
        .btn-tool:hover { filter: brightness(1.2); }
        .cursor-razor .clip { cursor: crosshair !important; }
        .cursor-razor .clip:hover { border-color: var(--danger) !important; }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="logo">
                <h1>BEATBOX</h1>
                <span>Pro Arranger V8</span>
            </div>
            <a href="https://buymeacoffee.com/" target="_blank" class="kofi-btn">☕ Support Project</a>
        </header>

        <div class="panel">
            <div class="section-header">
                <h2 class="section-title">1. Pattern Bank (Generator)</h2>
            </div>
            
            <div class="tabs-container" id="tabsContainer">
                <button class="btn-add-tab" onclick="addPatternTab()">+ New Beat</button>
            </div>

            <div class="bank-controls">
                <button id="btnPlayLoop" class="btn btn-play-loop">▶ Play Current Loop</button>
                <div class="slider-control">
                    <span>Grid:</span>
                    <select id="gridSelect" onchange="updateCurrentGrid(this.value)" style="background: var(--surface); color: white; padding: 4px; border-radius:4px; border:1px solid var(--border);">
                        <option value="4">4 Steps</option>
                        <option value="16" selected>16 Steps</option>
                        <option value="32">32 Steps</option>
                    </select>
                </div>
                <div class="slider-control">
                    <span>Tempo: <span id="bpmVal">120</span></span>
                    <input type="range" id="bpmSlider" min="70" max="180" value="120" oninput="updateCurrentTempo(this.value)">
                </div>
                <div style="flex:1;"></div>
                <div class="btn-drag-source" draggable="true" ondragstart="handlePatternDragStart(event)" title="Drag this into the Master Arranger timeline below">
                    🖐️ Drag Current Pattern to Timeline
                </div>
            </div>

            <div id="pattern-editor-container"></div>
            <button class="btn" style="background: var(--surface); border: 1px dashed var(--primary); color: var(--primary); margin-top: 10px; width: 100%;" onclick="addTrackToCurrentPattern()">➕ Add Instrument to Pattern</button>
        </div>

        <div class="panel">
            <div class="section-header">
                <h2 class="section-title">2. Master Arranger (Timeline)</h2>
                <div style="font-size: 12px; color: var(--text-muted);">Zoom Timeline: Hold Ctrl + Mouse Wheel</div>
            </div>

            <div class="studio-controls">
                <button id="btnPlayFull" class="btn btn-master-full">▶ Play Studio Mix</button>
                
                <div style="display:flex; gap: 10px; align-items:center;">
                    <select id="micSelect" style="background: var(--surface); color: white; padding: 8px; border-radius:6px; border:1px solid var(--border); min-width: 150px;"><option value="">Detecting Mics...</option></select>
                    <div style="width: 1px; height: 30px; background: var(--border); margin: 0 5px;"></div>
                    <button class="btn-tool" id="btnRazorTool">✂️ Split Tool: OFF</button>
                    <button class="btn-tool" id="btnDeleteClip" style="color: var(--danger); border-color: var(--danger);">🗑️ Delete Selection</button>
                    <div style="width: 1px; height: 30px; background: var(--border); margin: 0 5px;"></div>
                    <button id="btnDownload" class="btn btn-download">⬇ Export .WAV</button>
                </div>
            </div>

            <div id="arranger-container"></div>
        </div>
    </div>

    <div id="chordMenuContainer"></div>

    <script>
        // ==========================================
        // 1. CORE STATE & ARCHITECTURE
        // ==========================================
        let audioCtx, masterGain, mixDest, sharedReverbBuffer;
        
        let PPS = 50; 
        let playState = 'STOPPED'; // 'STOPPED', 'LOOP', 'STUDIO', 'SOLO'
        let globalStartTime = 0.0;
        let timerID;

        const PALETTE = ['#e3b341', '#f85149', '#58a6ff', '#2ea043', '#d2a8ff', '#ff7b72'];
        let patternIdCounter = 1; let trackIdCounter = 1; let clipIdCounter = 1;

        let patterns = []; let activePatternId = null;
        let arrangerClips = []; let vocalClips = []; 
        let clipboardData = null; // Copy/Paste state
        
        let vocalTracks = [
            { id: 'vox-1', volume: 1.0, pitch: 1.0, reverb: 0.0, echo: 0.0, inputGain: null, reverbMix: null, delayNode: null },
            { id: 'vox-2', volume: 1.0, pitch: 1.0, reverb: 0.0, echo: 0.0, inputGain: null, reverbMix: null, delayNode: null }
        ];

        let selectedClipId = null; let isRazorMode = false;
        
        let isRecording = false; let isWaitingToPunchIn = false;
        let activeRecTrack = null, mediaRec, audioChunks = [], punchInTargetTime = 0, recordingStartTime = 0, activeRecordingBlock = null, liveAnalyser, liveDataArray, liveCanvasCtx;

        let nextDrumTime = 0.0; let currentDrumStep = 0; let lastScheduledTime = 0;

        const AVAILABLE_CHORDS = ['C', 'Dm', 'Em', 'F', 'G', 'Am'];
        const INSTRUMENT_TYPES = [
            { val: 'kick', label: 'Kick', type: 'drum' }, { val: 'snare', label: 'Snare', type: 'drum' },
            { val: 'hihat', label: 'Hi-Hat', type: 'drum' }, { val: 'piano', label: 'Piano', type: 'chord' },
            { val: 'synth', label: 'Synth', type: 'chord' }
        ];

        // ==========================================
        // 2. DATA INITIALIZATION
        // ==========================================
        function createNewPattern() {
            const pid = `pat-${patternIdCounter++}`;
            const p = {
                id: pid, name: `Beat #${patternIdCounter-1}`, color: PALETTE[(patternIdCounter-2) % PALETTE.length],
                tempo: 120, steps: 16, tracks: [createTrack('hihat'), createTrack('snare'), createTrack('kick')]
            };
            p.tracks[0].pattern = [true, false, true, false, true, false, true, false, true, false, true, false, true, false, true, false, true, false, true, false, true, false, true, false, true, false, true, false, true, false, true, false];
            p.tracks[1].pattern = [false, false, false, false, true, false, false, false, false, false, false, false, true, false, false, false, false, false, false, false, true, false, false, false, false, false, false, false, true, false, false, false];
            p.tracks[2].pattern = [true, false, false, false, false, false, false, false, true, false, false, false, false, false, false, false, true, false, false, false, false, false, false, false, true, false, false, false, false, false, false, false];
            return p;
        }

        function createTrack(instrumentVal) {
            const info = INSTRUMENT_TYPES.find(i => i.val === instrumentVal);
            return {
                id: `trk-${trackIdCounter++}`, instrument: info.val, type: info.type,
                pitch: 1.0, volume: 1.0, reverb: info.type === 'drum' ? 0.0 : 0.4,
                inputGain: null, reverbMix: null, pattern: Array(32).fill(false)
            };
        }

        function initApp() {
            patterns.push(createNewPattern()); activePatternId = patterns[0].id;
            renderTabs(); renderActivePattern(); renderArranger(); initMicDetect();
        }

        // ==========================================
        // 3. UI RENDERING (PATTERN BANK)
        // ==========================================
        function renderTabs() {
            const container = document.getElementById('tabsContainer');
            const addBtn = container.querySelector('.btn-add-tab'); container.innerHTML = '';
            patterns.forEach(p => {
                const tab = document.createElement('div'); tab.className = `tab ${p.id === activePatternId ? 'active' : ''}`;
                tab.innerHTML = `<span class="tab-color-dot" style="background:${p.color}"></span> ${p.name}`;
                tab.onclick = () => { activePatternId = p.id; renderActivePattern(); renderTabs(); };
                container.appendChild(tab);
            });
            container.appendChild(addBtn);
        }

        window.addPatternTab = () => { patterns.push(createNewPattern()); activePatternId = patterns[patterns.length-1].id; renderTabs(); renderActivePattern(); };
        function getActivePattern() { return patterns.find(p => p.id === activePatternId); }

        window.updateCurrentGrid = (val) => { const p = getActivePattern(); p.steps = parseInt(val); renderActivePattern(); };
        window.updateCurrentTempo = (val) => { const p = getActivePattern(); p.tempo = parseInt(val); document.getElementById('bpmVal').innerText = p.tempo; };

        function renderActivePattern() {
            const p = getActivePattern();
            document.getElementById('bpmSlider').value = p.tempo; document.getElementById('bpmVal').innerText = p.tempo; document.getElementById('gridSelect').value = p.steps;
            const container = document.getElementById('pattern-editor-container'); container.innerHTML = '';

            p.tracks.forEach(track => {
                const row = document.createElement('div'); row.className = 'track-row';
                let optionsHTML = INSTRUMENT_TYPES.map(i => `<option value="${i.val}" ${track.instrument === i.val ? 'selected' : ''}>${i.label}</option>`).join('');
                
                row.innerHTML = `
                    <div class="track-header">
                        <select class="track-name-dropdown" onchange="changeTrackInstrument('${track.id}', this.value)">${optionsHTML}</select>
                        <div class="controls-grid">
                            <span>Vol</span><input type="range" class="mini-slider" min="0" max="2" step="0.1" value="${track.volume}" oninput="updateTrackFX('${track.id}', 'vol', this.value)">
                            <span>Pitch</span><input type="range" class="mini-slider" min="0.5" max="2" step="0.1" value="${track.pitch}" oninput="updateTrackFX('${track.id}', 'pitch', this.value)">
                            <span>Reverb</span><input type="range" class="mini-slider" min="0" max="1" step="0.1" value="${track.reverb}" oninput="updateTrackFX('${track.id}', 'reverb', this.value)">
                        </div>
                    </div>
                    <div class="track-viewport">
                        <div class="track-inner" style="display: flex; align-items: center; position: relative;">
                            <div id="ph-beat-${track.id}" class="playhead-beat"></div>
                            <div class="drum-grid" style="grid-template-columns: repeat(${p.steps}, 1fr);"></div>
                        </div>
                    </div>
                `;
                
                const grid = row.querySelector('.drum-grid');
                for (let i = 0; i < p.steps; i++) {
                    const step = document.createElement('div');
                    function updateStepVis() {
                        step.className = 'step';
                        if (i % 4 === 0) step.classList.add('start-beat');
                        if (i % 16 === 0 && i !== 0) step.classList.add('start-bar');
                        if (track.pattern[i]) step.classList.add('active', `type-${track.instrument}`);
                        step.innerText = (track.type === 'chord' && track.pattern[i]) ? track.pattern[i] : '';
                    }
                    updateStepVis();
                    step.onclick = (e) => { 
                        if (track.type === 'drum') { track.pattern[i] = !track.pattern[i]; updateStepVis(); }
                        else if (track.type === 'chord') { openChordMenu(e, track, i, updateStepVis); }
                    };
                    grid.appendChild(step);
                }
                container.appendChild(row);
            });
        }

        window.changeTrackInstrument = (trackId, newVal) => {
            const p = getActivePattern(); const track = p.tracks.find(t => t.id === trackId); const info = INSTRUMENT_TYPES.find(i => i.val === newVal);
            track.instrument = info.val; track.type = info.type; track.pattern = Array(32).fill(false); renderActivePattern();
        };
        window.updateTrackFX = (trackId, param, val) => {
            const p = getActivePattern(); const t = p.tracks.find(tr => tr.id === trackId);
            if(param === 'vol') t.volume = parseFloat(val); if(param === 'pitch') t.pitch = parseFloat(val); if(param === 'reverb') t.reverb = parseFloat(val);
            if(audioCtx) applyMasterFX(t);
        };
        window.addTrackToCurrentPattern = () => { getActivePattern().tracks.push(createTrack('kick')); renderActivePattern(); if(audioCtx) initMasterRouting(); };

        function openChordMenu(e, track, stepIndex, updateVis) {
            const container = document.getElementById('chordMenuContainer'); container.innerHTML = '';
            const menu = document.createElement('div'); menu.className = 'chord-menu';
            menu.style.left = `${e.clientX + 10}px`; menu.style.top = `${e.clientY + 10}px`;
            AVAILABLE_CHORDS.forEach(chord => {
                const btn = document.createElement('button'); btn.className = 'chord-btn'; btn.innerText = chord;
                btn.onclick = () => { track.pattern[stepIndex] = chord; updateVis(); container.innerHTML = ''; if (!isRecording && playState === 'STOPPED') { initAudio(); playChord(chord, track.instrument, track.pitch, audioCtx.currentTime, audioCtx, track.inputGain); } };
                menu.appendChild(btn);
            });
            const offBtn = document.createElement('button'); offBtn.className = 'chord-btn off'; offBtn.innerText = 'Clear';
            offBtn.onclick = () => { track.pattern[stepIndex] = false; updateVis(); container.innerHTML = ''; };
            menu.appendChild(offBtn); container.appendChild(menu);
        }
        document.body.addEventListener('mousedown', (e) => { if(!e.target.closest('.chord-menu') && !e.target.closest('.step')) document.getElementById('chordMenuContainer').innerHTML = ''; });

        // ==========================================
        // 4. UI RENDERING (MASTER ARRANGER WITH V6 VOCAL CONTROLS)
        // ==========================================
        function updateRecordButtons() {
            vocalTracks.forEach(track => {
                const btnNew = document.getElementById(`rec-btn-new-${track.id}`); if(!btnNew) return;
                const hasAudio = vocalClips.some(c => c.trackId === track.id);
                if (hasAudio) {
                    if(!isRecording) btnNew.innerText = '🔴 Overwrite';
                    btnNew.style.borderColor = 'var(--danger)'; btnNew.style.color = 'var(--danger)';
                } else {
                    if(!isRecording) btnNew.innerText = '🔴 Record';
                    btnNew.style.borderColor = 'white'; btnNew.style.color = 'white';
                }
            });
        }

        function renderArranger() {
            const container = document.getElementById('arranger-container'); container.innerHTML = '';

            // Master Beat Track
            const beatRow = document.createElement('div'); beatRow.className = 'track-row';
            beatRow.innerHTML = `
                <div class="track-header"><span style="color:white; font-weight:bold; font-size:15px;">Master Beat Track</span><span style="font-size:11px; color:var(--text-muted);">Drop pattern blocks here</span></div>
                <div class="track-viewport" ondragover="event.preventDefault()" ondrop="handlePatternDrop(event, 'beat')">
                    <div class="track-inner timeline-inner" id="timeline-beat"><canvas class="grid-canvas"></canvas><div id="ph-abs-beat" class="playhead-absolute"></div></div>
                </div>
            `;
            container.appendChild(beatRow);

        // ==========================================
        // 5. DRAG, DROP, CUT, PASTE, DELETE LOGIC
        // ==========================================
        window.handlePatternDragStart = (e) => { e.dataTransfer.setData('text/plain', activePatternId); };
        window.handlePatternDrop = (e, targetTrackId) => {
            if(targetTrackId !== 'beat') return; 
            const pId = e.dataTransfer.getData('text/plain'); const p = patterns.find(pat => pat.id === pId); if(!p) return;
            const rect = e.target.closest('.timeline-inner').getBoundingClientRect(); const dropX = e.clientX - rect.left;
            const duration = (60 / p.tempo / 4) * p.steps;
            arrangerClips.push({ id: `aclip-${clipIdCounter++}`, patternId: p.id, startTime: Math.max(0, dropX / PPS), duration: duration });
            renderClips();
        };

        function renderClips() {
            document.querySelectorAll('.clip, .recording-block').forEach(el => el.remove());
            let maxAudioSecs = 20;

            const beatTimeline = document.getElementById('timeline-beat');
            arrangerClips.forEach(clip => {
                const p = patterns.find(pat => pat.id === clip.patternId);
                const el = document.createElement('div'); el.className = `clip clip-beat ${clip.id === selectedClipId ? 'selected' : ''}`; el.id = clip.id;
                el.style.left = `${clip.startTime * PPS}px`; el.style.width = `${clip.duration * PPS}px`; el.style.background = p.color; el.innerText = p.name;
                const handle = document.createElement('div'); handle.className = 'resize-handle'; handle.onmousedown = (e) => handleClipStretch(e, clip);
                el.appendChild(handle); el.onmousedown = (e) => { if(!e.target.classList.contains('resize-handle')) handleClipDrag(e, clip, true); };
                beatTimeline.appendChild(el); if (clip.startTime + clip.duration > maxAudioSecs) maxAudioSecs = clip.startTime + clip.duration;
            });

            vocalClips.forEach(clip => {
                const tl = document.getElementById(`timeline-${clip.trackId}`); if(!tl) return;
                const el = document.createElement('div'); el.className = `clip clip-vocal ${clip.id === selectedClipId ? 'selected' : ''}`; el.id = clip.id;
                el.style.left = `${clip.startTime * PPS}px`; el.style.width = `${clip.duration * PPS}px`; el.innerHTML = `<canvas class="wave-canvas"></canvas>`;
                el.onmousedown = (e) => handleClipDrag(e, clip, false); tl.appendChild(el);
                const ctx = el.querySelector('canvas').getContext('2d'); const w = Math.max(1, clip.duration * PPS); ctx.canvas.width = w; ctx.canvas.height = 90;
                const data = clip.buffer.getChannelData(0); ctx.fillStyle = 'rgba(255,255,255,0.8)'; const step = Math.ceil(data.length / w);
                for(let i=0; i<w; i++) { let max=0; for(let j=0; j<step; j++) max = Math.max(max, Math.abs(data[i*step+j] || 0)); ctx.fillRect(i, 45 - (max*45), 1, max*90 || 1); }
                if (clip.startTime + clip.duration > maxAudioSecs) maxAudioSecs = clip.startTime + clip.duration;
            });

            const reqPx = (maxAudioSecs + 5) * PPS;
            document.querySelectorAll('.timeline-inner').forEach(inner => { if (inner.clientWidth < reqPx) inner.style.width = `${reqPx}px`; });
            
            updateRecordButtons(); drawSyncGrids();

        function handleClipStretch(e, clip) {
            e.preventDefault(); e.stopPropagation(); const startX = e.clientX; const startDur = clip.duration;
            const onMove = (mEv) => { clip.duration = Math.max(0.5, startDur + ((mEv.clientX - startX) / PPS)); renderClips(); };
            const onUp = () => { window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onUp); };
            window.addEventListener('mousemove', onMove); window.addEventListener('mouseup', onUp);
        }

        function handleClipDrag(e, clip, isBeat) {
            if(isRazorMode) { handleClipSplit(e, clip, isBeat); return; }
            e.preventDefault(); selectedClipId = clip.id; renderClips();
            const startX = e.clientX; const startT = clip.startTime;
            const onMove = (mEv) => {
                let targetTrackId = clip.trackId; // default
                if(!isBeat) {
                    document.querySelectorAll('.vocal-timeline-inner').forEach(tEl => {
                        const r = tEl.getBoundingClientRect(); if (mEv.clientY >= r.top && mEv.clientY <= r.bottom) targetTrackId = tEl.id.replace('timeline-', '');
                    });
                }
                clip.startTime = Math.max(0, startT + ((mEv.clientX - startX) / PPS));
                if(!isBeat && clip.trackId !== targetTrackId) clip.trackId = targetTrackId;
                renderClips();
            };
            const onUp = () => { window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onUp); };
            window.addEventListener('mousemove', onMove); window.addEventListener('mouseup', onUp);
        }

        async function handleClipSplit(e, clip, isBeat) {
            const r = e.target.closest('.clip').getBoundingClientRect(); const ratio = (e.clientX - r.left) / r.width;
            if(ratio <= 0.05 || ratio >= 0.95) return;
            
            if (isBeat) {
                const origD = clip.duration; clip.duration = origD * ratio;
                arrangerClips.push({ id: `aclip-${clipIdCounter++}`, patternId: clip.patternId, startTime: clip.startTime + clip.duration, duration: origD * (1 - ratio) });
            } else {
                const splitS = Math.floor(clip.buffer.length * ratio);
                const b1 = audioCtx.createBuffer(1, splitS, audioCtx.sampleRate); const b2 = audioCtx.createBuffer(1, clip.buffer.length - splitS, audioCtx.sampleRate);
                b1.copyToChannel(clip.buffer.getChannelData(0).slice(0, splitS), 0); b2.copyToChannel(clip.buffer.getChannelData(0).slice(splitS), 0);
                clip.buffer = b1; const origD = clip.duration; clip.duration = origD * ratio;
                vocalClips.push({ id: `clip-${clipIdCounter++}`, buffer: b2, trackId: clip.trackId, startTime: clip.startTime + clip.duration, duration: origD * (1 - ratio) });
            }
            renderClips();
        }

        // Keyboard Shortcuts Restored (Ctrl C/V, Delete)
        window.addEventListener('keydown', (e) => {

        // ==========================================

        function initMicDetect() {
            navigator.mediaDevices.enumerateDevices().then(devices => {
                const sel = document.getElementById('micSelect'); sel.innerHTML = '<option value="">Default Mic</option>';
                devices.filter(d => d.kind === 'audioinput').forEach((d, i) => { sel.innerHTML += `<option value="${d.deviceId}">${d.label || 'Mic '+i}</option>`; });

        function buildAudioGraph() {
            if(!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                masterGain = audioCtx.createGain(); masterGain.connect(audioCtx.destination);
                mixDest = audioCtx.createMediaStreamDestination(); masterGain.connect(mixDest);
                
                let len = audioCtx.sampleRate * 2.5; sharedReverbBuffer = audioCtx.createBuffer(2, len, audioCtx.sampleRate);
                for (let i = 0; i < len; i++) { let n = 1-(i/len); sharedReverbBuffer.getChannelData(0)[i] = (Math.random()*2-1)*Math.pow(n,3); sharedReverbBuffer.getChannelData(1)[i] = (Math.random()*2-1)*Math.pow(n,3); }
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function initMasterRouting() {
            patterns.forEach(p => p.tracks.forEach(track => {
                if (track.inputGain) return;
                track.inputGain = audioCtx.createGain(); track.reverbMix = audioCtx.createGain(); track.convolver = audioCtx.createConvolver(); track.convolver.buffer = sharedReverbBuffer;
                track.inputGain.connect(masterGain); track.inputGain.connect(track.convolver); track.convolver.connect(track.reverbMix); track.reverbMix.connect(masterGain);
                applyMasterFX(track);
            }));
        }

        function initVocalRouting() {
            vocalTracks.forEach(track => {
                if(track.inputGain) return;
                track.inputGain = audioCtx.createGain(); track.reverbMix = audioCtx.createGain(); track.convolver = audioCtx.createConvolver(); track.convolver.buffer = sharedReverbBuffer;
                track.delayNode = audioCtx.createDelay(5.0); track.delayNode.delayTime.value = 0; track.delayFeedback = audioCtx.createGain(); track.delayFeedback.gain.value = 0.4; track.delayMix = audioCtx.createGain();
                track.delayNode.connect(track.delayFeedback); track.delayFeedback.connect(track.delayNode);
                track.inputGain.connect(masterGain); track.inputGain.connect(track.convolver); track.convolver.connect(track.reverbMix); track.reverbMix.connect(masterGain);
                track.inputGain.connect(track.delayNode); track.delayNode.connect(track.delayMix); track.delayMix.connect(masterGain);
                applyVoxFX(track);
            });
        }

        function applyMasterFX(track) { if(!track.inputGain) return; track.inputGain.gain.value = track.volume; track.reverbMix.gain.value = track.reverb; }
        function applyVoxFX(track) {
            if(!track.inputGain) return;
            track.inputGain.gain.value = track.volume; track.reverbMix.gain.value = track.reverb;
            track.delayNode.delayTime.value = track.echo > 0 ? (60 / 120) * 0.75 : 0; track.delayMix.gain.value = track.echo;
        }

        window.updateVoxFX = (id, param, val) => { const t = vocalTracks.find(v => v.id === id); val = parseFloat(val); if(param === 'vol') t.volume = val; if(param === 'pitch') t.pitch = val; if(param === 'reverb') t.reverb = val; if(param === 'echo') t.echo = val; applyVoxFX(t); };

        function playSynth(type, pitch, time, context=audioCtx, dest=masterGain) {
            const osc = context.createOscillator(), gain = context.createGain();
            osc.type = type === 'kick' ? 'sine' : type === 'snare' ? 'triangle' : type === 'hihat' ? 'square' : type;
            osc.frequency.setValueAtTime((type==='kick'?120:type==='snare'?250:800) * pitch, time);
            if(type==='kick') osc.frequency.exponentialRampToValueAtTime(40, time+0.1);
            osc.connect(gain); gain.connect(dest);
            gain.gain.setValueAtTime(0.5, time); gain.gain.exponentialRampToValueAtTime(0.01, time + (type==='hihat'?0.1:0.3));
            osc.start(time); osc.stop(time + 0.5);
        }

        function playChord(chord, type, pitch, time, context=audioCtx, dest=masterGain) {
            const freqs = {'C':[261,329,392],'Dm':[293,349,440],'Em':[329,392,493],'F':[349,440,523],'G':[392,493,587],'Am':[440,523,659]}[chord] || [261,329,392];
            freqs.forEach(f => {
                const osc = context.createOscillator(), gain = context.createGain();
                osc.type = type === 'synth' ? 'square' : 'sine'; osc.frequency.setValueAtTime(f * pitch, time);
                osc.connect(gain); gain.connect(dest);
                gain.gain.setValueAtTime(0, time); gain.gain.linearRampToValueAtTime(0.1, time+0.05); gain.gain.exponentialRampToValueAtTime(0.001, time+1.0);
                osc.start(time); osc.stop(time+1.0);
            });
        }

        function scheduler() {
            if (playState === 'STOPPED') return;
            const now = audioCtx.currentTime; const lookahead = 0.1; 

            if (playState === 'LOOP') {
                const p = getActivePattern(); const stepDur = 60.0 / p.tempo / 4;
                while (nextDrumTime < now + lookahead) {
                    p.tracks.forEach(track => {
                        if (track.pattern[currentDrumStep]) {
                            if (track.type === 'drum') playSynth(track.instrument, track.pitch, nextDrumTime, audioCtx, track.inputGain);
                            if (track.type === 'chord') playChord(track.pattern[currentDrumStep], track.instrument, track.pitch, nextDrumTime, audioCtx, track.inputGain);
                        }
                    });
                    nextDrumTime += stepDur; currentDrumStep = (currentDrumStep + 1) % p.steps;
                }
            } else if (playState === 'STUDIO' || playState === 'SOLO') {
                const absTime = now - globalStartTime; const windowEnd = absTime + lookahead;

                if (playState !== 'SOLO') {
                    arrangerClips.forEach(clip => {
                        const p = patterns.find(pat => pat.id === clip.patternId); if (!p) return;
                        const stepDur = 60.0 / p.tempo / 4; const loopDur = stepDur * p.steps;
                        
                        if (clip.startTime <= windowEnd && (clip.startTime + clip.duration) >= lastScheduledTime) {
                            let clipLocalStart = Math.max(0, lastScheduledTime - clip.startTime); let clipLocalEnd = Math.min(clip.duration, windowEnd - clip.startTime);
                            let timeIterator = Math.ceil(clipLocalStart / stepDur) * stepDur;
                            while(timeIterator < clipLocalEnd) {
                                let stepIndex = Math.floor((timeIterator % loopDur) / stepDur); let absTrigger = globalStartTime + clip.startTime + timeIterator;
                                p.tracks.forEach(track => {
                                    if (track.pattern[stepIndex]) {
                                        if (track.type === 'drum') playSynth(track.instrument, track.pitch, absTrigger, audioCtx, track.inputGain);
                                        if (track.type === 'chord') playChord(track.pattern[stepIndex], track.instrument, track.pitch, absTrigger, audioCtx, track.inputGain);
                                    }
                                });
                                timeIterator += stepDur;
                            }
                        }
                    });
                }
                lastScheduledTime = windowEnd;
            }
            timerID = requestAnimationFrame(scheduler);
        }

        window.startRecording = async (trackId, isAppend) => {
            const btnNew = document.getElementById(`rec-btn-new-${trackId}`); const btnAppend = document.getElementById(`rec-btn-append-${trackId}`);
            if (isRecording || isWaitingToPunchIn) { stopPlayback(); return; }
            buildAudioGraph(); initVocalRouting(); initMasterRouting();

            if (!isAppend) { clearVocalTrack(trackId); punchInTargetTime = 0; } 
            else { punchInTargetTime = 0; vocalClips.filter(c => c.trackId === trackId).forEach(c => { if (c.startTime + c.duration > punchInTargetTime) punchInTargetTime = c.startTime + c.duration; }); }

            try {
                const micId = document.getElementById('micSelect').value;
                const stream = await navigator.mediaDevices.getUserMedia(micId ? { audio: { deviceId: { exact: micId } } } : { audio: true });
                const micSource = audioCtx.createMediaStreamSource(stream);
                liveAnalyser = audioCtx.createAnalyser(); liveAnalyser.fftSize = 512; micSource.connect(liveAnalyser); liveDataArray = new Uint8Array(liveAnalyser.frequencyBinCount);
                
                mediaRec = new MediaRecorder(stream); audioChunks = [];
                mediaRec.ondataavailable = e => { if(e.data.size > 0) audioChunks.push(e.data); };
                mediaRec.onstop = async () => {
                    const blob = new Blob(audioChunks, { type: 'audio/webm' }); const ab = await blob.arrayBuffer(); const buf = await audioCtx.decodeAudioData(ab);
                    vocalClips.push({ id: `clip-${clipIdCounter++}`, buffer: buf, trackId: trackId, startTime: punchInTargetTime, duration: buf.duration });
                    stream.getTracks().forEach(t => t.stop()); renderClips();
                };
                
                activeRecTrack = trackId; startPlayback('STUDIO');

                if (punchInTargetTime === 0) {
                    mediaRec.start(); isRecording = true; recordingStartTime = audioCtx.currentTime;
                    createLiveBlock(trackId); btnNew.classList.add('is-recording'); btnNew.innerText = '⏹ Stop';
                } else {
                    isWaitingToPunchIn = true; btnAppend.classList.add('is-waiting'); btnAppend.innerText = '⏳ Wait...';
                }
            } catch (e) { alert("Mic error. Please check permissions."); }
        };

        function createLiveBlock(trackId) {
            const trackEl = document.getElementById(`timeline-${trackId}`);
            activeRecordingBlock = document.createElement('div'); activeRecordingBlock.className = 'clip recording-block'; activeRecordingBlock.innerHTML = `<canvas class="wave-canvas"></canvas>`;
            trackEl.appendChild(activeRecordingBlock); liveCanvasCtx = activeRecordingBlock.querySelector('canvas').getContext('2d');
        }

        function startPlayback(mode, targetTrackId = null) {
            buildAudioGraph(); initMasterRouting(); initVocalRouting(); clearTimeout(timerID);
            playState = mode; globalStartTime = audioCtx.currentTime + 0.05; nextDrumTime = globalStartTime; currentDrumStep = 0; lastScheduledTime = 0;
            
            if(mode === 'STUDIO' || mode === 'SOLO') {
                vocalClips.forEach(c => {
                    if (mode === 'STUDIO' || (mode === 'SOLO' && c.trackId === targetTrackId)) {
                        const trackSet = vocalTracks.find(t => t.id === c.trackId);
                        const src = audioCtx.createBufferSource(); src.buffer = c.buffer; src.playbackRate.value = trackSet.pitch; src.connect(trackSet.inputGain);
                        src.start(globalStartTime + c.startTime); c.sourceNode = src;
                    }

            requestAnimationFrame(updateVisuals); scheduler();
        }

        function stopPlayback() {
            cancelAnimationFrame(timerID); playState = 'STOPPED';
            if(isRecording || isWaitingToPunchIn) { if (mediaRec && mediaRec.state !== 'inactive') mediaRec.stop(); isRecording = false; isWaitingToPunchIn = false; if(activeRecordingBlock) activeRecordingBlock.remove(); }
            vocalClips.forEach(c => { if(c.sourceNode) { try{c.sourceNode.stop();}catch(e){} } });
            
            document.getElementById('btnPlayFull').innerText = "▶ Play Studio Mix"; document.getElementById('btnPlayFull').classList.remove('playing');
            document.getElementById('btnPlayLoop').innerText = "▶ Play Current Loop"; document.getElementById('btnPlayLoop').classList.remove('playing');
            document.querySelectorAll('.btn-rec-append').forEach(btn => { btn.classList.remove('is-waiting', 'is-recording'); btn.innerText = '➕ Append'; });
            updateRecordButtons();
            
            document.querySelectorAll('.playhead-beat, .playhead-absolute').forEach(ph => ph.style.display = 'none');
        }

        document.getElementById('btnPlayLoop').onclick = (e) => { if(playState !== 'STOPPED') stopPlayback(); else { startPlayback('LOOP'); e.target.innerText = "⏸ Stop Loop"; e.target.classList.add('playing'); } };
        document.getElementById('btnPlayFull').onclick = (e) => { if(playState !== 'STOPPED') stopPlayback(); else { startPlayback('STUDIO'); e.target.innerText = "⏸ Stop Studio"; e.target.classList.add('playing'); } };
        window.playSolo = (tid) => { if(playState === 'SOLO') stopPlayback(); else { startPlayback('SOLO', tid); document.getElementById('btnPlayFull').innerText = "⏸ Stop Solo"; document.getElementById('btnPlayFull').classList.add('playing'); } };

        function drawSyncGrids() {
            const stepPx = (60/120/4) * PPS; // Use absolute 120bpm for visual reference across master timeline
            document.querySelectorAll('.grid-canvas').forEach(canvas => {
                const p = canvas.parentElement; canvas.width = p.clientWidth; canvas.height = p.clientHeight;
                const ctx = canvas.getContext('2d'); ctx.clearRect(0,0, canvas.width, canvas.height);
                for(let x=0; x<canvas.width; x+=stepPx) {
                    ctx.beginPath(); ctx.strokeStyle = Math.round(x/stepPx)%4===0 ? 'rgba(255,255,255,0.3)' : 'rgba(255,255,255,0.05)';
                    ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke();
                }
            });
        }

        function updateVisuals() {
            if(playState === 'STOPPED') return;
            const now = audioCtx.currentTime;
            
            if(playState === 'LOOP') {
                const p = getActivePattern(); const loopDur = (60/p.tempo/4)*p.steps; const pct = ((now - globalStartTime) % loopDur) / loopDur * 100;
                p.tracks.forEach(t => { const ph = document.getElementById(`ph-beat-${t.id}`); if(ph) { ph.style.display='block'; ph.style.left=`${pct}%`; } });
            }
            if(playState === 'STUDIO' || playState === 'SOLO') {
                const absTime = now - globalStartTime; const px = absTime * PPS;
                document.querySelectorAll('.playhead-absolute').forEach(ph => { 
                    ph.style.display='block'; ph.style.left=`${px}px`; 
                    const vp = ph.closest('.track-viewport'); if (vp && (px > vp.scrollLeft + vp.clientWidth * 0.9)) vp.scrollLeft = px - vp.clientWidth * 0.5;
                });
                
                if (isWaitingToPunchIn && absTime >= punchInTargetTime) {
                    isWaitingToPunchIn = false; mediaRec.start(); isRecording = true; recordingStartTime = audioCtx.currentTime; createLiveBlock(activeRecTrack);
                    const btnA = document.getElementById(`rec-btn-append-${activeRecTrack}`); if(btnA) { btnA.classList.remove('is-waiting'); btnA.classList.add('is-recording'); btnA.innerText = '⏹ Stop'; }
                }
                if (isRecording && activeRecordingBlock) {
                    const recElapsed = audioCtx.currentTime - recordingStartTime; activeRecordingBlock.style.left = `${punchInTargetTime * PPS}px`; activeRecordingBlock.style.width = `${recElapsed * PPS}px`;
                    if(liveAnalyser) {
                        liveAnalyser.getByteTimeDomainData(liveDataArray); const w = activeRecordingBlock.clientWidth; const h = 90;
                        liveCanvasCtx.canvas.width = w; liveCanvasCtx.canvas.height = h; liveCanvasCtx.clearRect(0,0,w,h); liveCanvasCtx.lineWidth = 2; liveCanvasCtx.strokeStyle = '#fff'; liveCanvasCtx.beginPath();
                        const sliceW = w / liveAnalyser.frequencyBinCount; let cx = 0;
                        for(let i=0; i<liveAnalyser.frequencyBinCount; i++) { const y = (liveDataArray[i] / 128.0) * (h/2); if(i===0) liveCanvasCtx.moveTo(cx,y); else liveCanvasCtx.lineTo(cx,y); cx += sliceW; }
                        liveCanvasCtx.stroke();
                    }
                }
            }
            requestAnimationFrame(updateVisuals);
        }

        // ==========================================
        // 7. EXPORT WAV ENGINE (RESTORED & UPGRADED)
        // ==========================================
        document.getElementById('btnDownload').addEventListener('click', async (e) => {
            buildAudioGraph(); const btn = e.target; const originalText = btn.innerText; btn.innerText = "⏳ Bouncing Arranger Mix..."; btn.disabled = true;

            let maxDuration = 2; 
            arrangerClips.forEach(c => { if(c.startTime + c.duration > maxDuration) maxDuration = c.startTime + c.duration; });
            vocalClips.forEach(c => { if (c.startTime + c.duration > maxDuration) maxDuration = c.startTime + c.duration; });
            maxDuration += 0.5; 

            const offlineCtx = new OfflineAudioContext(2, audioCtx.sampleRate * maxDuration, audioCtx.sampleRate);
            const offlineMaster = offlineCtx.createGain(); offlineMaster.connect(offlineCtx.destination);
            
            let len = offlineCtx.sampleRate * 2.5; const offlineReverbBuffer = offlineCtx.createBuffer(2, len, offlineCtx.sampleRate);
            for (let i = 0; i < len; i++) { let n = 1-(i/len); offlineReverbBuffer.getChannelData(0)[i] = (Math.random()*2-1)*Math.pow(n,3); offlineReverbBuffer.getChannelData(1)[i] = (Math.random()*2-1)*Math.pow(n,3); }

            const offlinePatterns = {};
            patterns.forEach(p => {
                offlinePatterns[p.id] = { p: p, tracks: p.tracks.map(t => {
                    const g = offlineCtx.createGain(); const rMix = offlineCtx.createGain(); const conv = offlineCtx.createConvolver(); conv.buffer = offlineReverbBuffer;
                    g.connect(offlineMaster); g.connect(conv); conv.connect(rMix); rMix.connect(offlineMaster);
                    g.gain.value = t.volume; rMix.gain.value = t.reverb;
                    return { id: t.id, type: t.type, instrument: t.instrument, inputGain: g, pitch: t.pitch };
                })};
            });

            const offlineVocalTracks = vocalTracks.map(t => {
                const g = offlineCtx.createGain(); const rMix = offlineCtx.createGain(); const conv = offlineCtx.createConvolver(); conv.buffer = offlineReverbBuffer;
                const d = offlineCtx.createDelay(5.0); const fb = offlineCtx.createGain(); const dMix = offlineCtx.createGain();
                d.delayTime.value = t.echo > 0 ? (60 / 120) * 0.75 : 0; fb.gain.value = 0.4;
                d.connect(fb); fb.connect(d); d.connect(dMix); dMix.connect(offlineMaster);
                g.connect(offlineMaster); g.connect(conv); conv.connect(rMix); rMix.connect(offlineMaster); g.connect(d);
                g.gain.value = t.volume; rMix.gain.value = t.reverb; dMix.gain.value = t.echo;
                return { id: t.id, inputGain: g, pitch: t.pitch };
            });

            // Schedule Arranger Blocks
            arrangerClips.forEach(clip => {
                const pData = offlinePatterns[clip.patternId]; if(!pData) return;
                const p = pData.p; const stepDur = 60.0 / p.tempo / 4; const loopDur = stepDur * p.steps;
                let renderTime = clip.startTime;
                while (renderTime < clip.startTime + clip.duration) {
                    let clipLocalTime = renderTime - clip.startTime;
                    let stepIndex = Math.floor((clipLocalTime % loopDur) / stepDur);
                    
                    pData.tracks.forEach((trackSettings, idx) => {
                        if (p.tracks[idx].pattern[stepIndex]) {
                            if (trackSettings.type === 'drum') playSynth(trackSettings.instrument, trackSettings.pitch, renderTime, offlineCtx, trackSettings.inputGain);
                            if (trackSettings.type === 'chord') playChord(p.tracks[idx].pattern[stepIndex], trackSettings.instrument, trackSettings.pitch, renderTime, offlineCtx, trackSettings.inputGain);
                        }
                    });
                    renderTime += stepDur;
                }
            });

            // Schedule Vocals
            vocalClips.forEach(c => {
                const trackSettings = offlineVocalTracks.find(t => t.id === c.trackId);
                const source = offlineCtx.createBufferSource(); source.buffer = c.buffer;
                source.playbackRate.value = trackSettings.pitch; source.connect(trackSettings.inputGain);
                source.start(c.startTime);
            });

            const renderedBuffer = await offlineCtx.startRendering();
            
            // Audio Buffer to WAV
            const numOfChan = renderedBuffer.numberOfChannels, length = renderedBuffer.length * numOfChan * 2 + 44;
            const out = new ArrayBuffer(length), view = new DataView(out);
            const channels = [], sampleRate = renderedBuffer.sampleRate; let offset = 0, pos = 0;
            function setUint16(data) { view.setUint16(pos, data, true); pos += 2; } function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }
            setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157); setUint32(0x20746d66); setUint32(16); setUint16(1); setUint16(numOfChan);
            setUint32(sampleRate); setUint32(sampleRate * 2 * numOfChan); setUint16(numOfChan * 2); setUint16(16); setUint32(0x61746164); setUint32(length - pos - 4);
            for(let i=0; i<renderedBuffer.numberOfChannels; i++) channels.push(renderedBuffer.getChannelData(i));
            while(offset < renderedBuffer.length) {
                for(let i=0; i<numOfChan; i++) {
                    let sample = Math.max(-1, Math.min(1, channels[i][offset])); sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
                    view.setInt16(pos, sample, true); pos += 2;
                }
                offset++;
            }
            
            const wavBlob = new Blob([out], { type: "audio/wav" }); const url = URL.createObjectURL(wavBlob);
            const a = document.createElement('a'); a.style.display = 'none'; a.href = url;
            a.download = 'BeatBox_Pro_Mix.wav'; document.body.appendChild(a); a.click();
            btn.innerText = originalText; btn.disabled = false;
        });

        initApp();
    </script>
